name: v15 Pareto-gated Local Search vs Ungated and NSGA-II K16
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v15-pareto-gate-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: v15 ${{ matrix.dag }} ${{ matrix.speed }} seed${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dag: [CyberShake_30, Montage_25]
        speed: [default, staggered]
        seed: [161, 162]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and assert counted timeline semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD > ci-logs/source_sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
          java -Dworkflowsim.planningStageInAware=true -cp 'build/classes:lib/*' org.workflowsim.planning.TimelineParetoNeighborTest
          java -cp 'build/classes:lib/*' org.workflowsim.planning.DecoderInsertionRegressionTest
      - name: Execute six search algorithms with equal 3030 + K16 true WorkflowSim budgets
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Dliwsa.vmSpeedProfile='${{ matrix.speed }}' \
            -Dliwsa.vmPriceProfile=default \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.dag }}' '${{ matrix.seed }}' 30 100 \
            "Output&Results/v15-search-${{ matrix.speed }}-${{ matrix.dag }}-s${{ matrix.seed }}" \
            v15-search-sixarm 2>&1 | tee ci-logs/search.log
          test "$(grep -c 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/search.log)" -eq 5
          python3 - <<'PY'
          import re,pathlib,csv
          text=pathlib.Path('ci-logs/search.log').read_text()
          matches=[tuple(map(int,m)) for m in re.findall(
          r'FLA_PAIRED_LOCAL mode=(\d+) trials=(\d+) changed=(\d+) dominates=(\d+) dominated=(\d+) incomparable=(\d+) gate=(\d+) rejected=(\d+) evaluations=(\d+)',text)]
          assert len(matches)==4,matches
          assert {(x[0],x[6]) for x in matches}=={(1,0),(2,0),(1,1),(2,1)}
          for mode,n,changed,win,lose,trade,gate,rejected,evals in matches:
              assert n==1400 and evals==3030 and changed<=n and win+lose+trade==n
              assert rejected==(lose if gate else 0)
          pref=pathlib.Path("Output&Results/v15-search-${{ matrix.speed }}-${{ matrix.dag }}-s${{ matrix.seed }}")
          with pathlib.Path(str(pref)+"_summary.csv").open(newline="") as f:s=list(csv.DictReader(f))
          with pathlib.Path(str(pref)+"_replays.csv").open(newline="") as f:r=list(csv.DictReader(f))
          assert len(s)==6 and len(r)==96
          assert all(int(x['evaluations'])==int(x['captured_evaluations'])==3030 and int(x['replayed'])==16 for x in s)
          print('PASS six arm equal 3030 + K16, 1400 pairs, strict Pareto survivor gate and cost-seeded identity')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-${{ matrix.dag }}-${{ matrix.speed }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/*_summary.csv
            Output&Results/*_replays.csv
            Output&Results/*_budget_protocol.txt
          retention-days: 90
  report:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v15-*-${{ github.run_id }}
          path: original
      - name: Verify matched simulator fronts and six-arm fixed-primary HV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_v15_search_report.py
          python3 scripts/fla_v15_search_report.py original reports | tee reports/analysis.log
          git rev-parse HEAD > reports/analysis_source_sha.txt
          cat reports/v15_search_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-report-${{ github.run_id }}
          path: reports
          retention-days: 90
