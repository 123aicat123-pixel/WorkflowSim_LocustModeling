name: v17 Read-only DAG Topology and True Simulator Join
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v17-dax-feature-join.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41630971648
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: fla-dax-structure-41630971648
          path: originals/dax
      - uses: actions/download-artifact@v4
        with:
          run-id: 41626382711
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: v17-confirm-report-41626382711
          path: originals/v17
      - name: Verify original immutable scores and DAX parser metadata before joining
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_v17_dax_feature_join.py
          python3 scripts/fla_v17_dax_feature_join.py originals reports | tee reports/join.log
          git rev-parse HEAD > reports/analysis_source_sha.txt
          cat reports/v17_dax_feature_join.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v17-dax-feature-join-${{ github.run_id }}
          path: reports
          retention-days: 90
