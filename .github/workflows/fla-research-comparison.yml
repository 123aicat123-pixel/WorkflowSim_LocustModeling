name: FLA four-algorithm simulated Pareto pilot

on:
  push:
    branches: [fla-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-pareto-pilot:
    name: Pilot ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_25, Sipht_30, CyberShake_30, Epigenomics_24, Inspiral_30]
        seed: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout fla-baseline
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile project from source (not stale bin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/commit.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/source-list.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/source-list.txt 2>&1 | tee ci-logs/compile.log
      - name: Run all four algorithms, replay planned nondominated fronts
        shell: bash
        run: |
          set -euo pipefail
          java -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 12 12 'Output&Results/fla_${{ matrix.workflow }}_seed${{ matrix.seed }}' \
            2>&1 | tee ci-logs/fla-research.log
      - name: Assert all algorithms and positive simulation objectives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, math, pathlib
          p=pathlib.Path('Output&Results/fla_${{ matrix.workflow }}_seed${{ matrix.seed }}_summary.csv')
          with p.open(newline='') as f: data=list(csv.DictReader(f))
          wanted={'FLA-3W','DAG-Pareto-FLA','NSGA-II','MLEAO'}
          assert {r['algorithm'] for r in data}==wanted, data
          assert len(data)==4
          for row in data:
              assert int(row['evaluations'])>0
              assert 0<int(row['evaluations'])<=int(row['budget_cap'])
              assert int(row['replayed'])>0
              assert float(row['sim_hv'])>=0 and math.isfinite(float(row['sim_hv']))
              assert float(row['planned_hv'])>=0 and math.isfinite(float(row['planned_hv']))
          q=pathlib.Path('Output&Results/fla_${{ matrix.workflow }}_seed${{ matrix.seed }}_replays.csv')
          with q.open(newline='') as f: candidates=list(csv.DictReader(f))
          assert len(candidates)==sum(int(r['replayed']) for r in data)
          for row in candidates:
              assert all(math.isfinite(float(row[c])) and float(row[c])>0 for c in
                  ('planned_makespan','planned_cost','independent_planned_makespan',
                   'independent_planned_cost','sim_makespan','sim_cost'))
          print('Independent decoder discrepancies (max absolute percent):')
          for algorithm in sorted(wanted):
              rr=[r for r in candidates if r['algorithm']==algorithm]
              errmk=max(100*abs(float(r['planned_makespan'])-float(r['independent_planned_makespan']))/
                        float(r['independent_planned_makespan']) for r in rr)
              errcost=max(100*abs(float(r['planned_cost'])-float(r['independent_planned_cost']))/
                          float(r['independent_planned_cost']) for r in rr)
              print(algorithm,'makespan',round(errmk,6),'cost',round(errcost,6))
          print('PASS pilot',p,'records',len(data),'replays',len(candidates))
          for row in data:
              print(row['algorithm'],'evals',row['evaluations'],'simHV',row['sim_hv'],
                    'planHV',row['planned_hv'],'replayed',row['replayed'])
          PY
      - name: Upload raw research runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-comparison-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/fla_${{ matrix.workflow }}_seed${{ matrix.seed }}_*
          retention-days: 30
          if-no-files-found: warn

  aggregate-frozen-hv:
    name: Frozen-reference simulator HV across all pilot seeds
    needs: [simulated-pareto-pilot]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch all successful matrix experiment outputs
        uses: actions/download-artifact@v4
        with:
          pattern: fla-comparison-*-${{ github.run_id }}
          path: comparison-data
          merge-multiple: false
      - name: Score all experiments with one FROZEN reference per workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import csv, collections, pathlib, math, statistics
          root=pathlib.Path('comparison-data')
          summaries=list(root.rglob('*_summary.csv'))
          replays=list(root.rglob('*_replays.csv'))
          expected=5*5
          assert len(summaries)==expected and len(replays)==expected, (len(summaries),len(replays),expected)
          inputs=[]
          for p in replays:
              with p.open(newline='') as f: inputs.extend(csv.DictReader(f))
          groups=collections.defaultdict(list)
          refs={}
          for row in inputs:
              key=(row['workflow'],row['algorithm'],int(row['seed']))
              groups[key].append((float(row['sim_makespan']),float(row['sim_cost'])))
          workflows={k[0] for k in groups}
          algorithms={'FLA-3W','DAG-Pareto-FLA','NSGA-II','MLEAO'}
          assert len(workflows)==5
          for wf in workflows:
              pts=[p for key,arr in groups.items() if key[0]==wf for p in arr]
              refs[wf]=(max(x for x,_ in pts)*1.05+1,max(y for _,y in pts)*1.05+1)
          def nondominated(points):
              unique=sorted(set(points))
              ans=[]
              for p in unique:
                  if not any(q[0]<=p[0] and q[1]<=p[1] and q!=p for q in unique):
                      ans.append(p)
              return ans
          def hv2d(points,ref):
              front=nondominated(points)
              total=0.0
              prev=ref[1]
              for m,c in sorted(front):
                  assert m<ref[0] and c<ref[1]
                  if c<prev:
                      total+=(ref[0]-m)*(prev-c)
                      prev=c
              return total
          rows=[]
          for (wf,alg,seed),pts in sorted(groups.items()):
              rows.append(dict(workflow=wf,algorithm=alg,seed=seed,sim_hv=hv2d(pts,refs[wf]),
                               ref_m=refs[wf][0],ref_c=refs[wf][1],replayed=len(pts)))
          assert len(rows)==expected*4, len(rows)
          for wf in workflows:
              for seed in (1,2,3,4,5):
                  assert {x['algorithm'] for x in rows if x['workflow']==wf and x['seed']==seed}==algorithms
          with pathlib.Path('reports/frozen_hv.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]))
              w.writeheader();w.writerows(rows)
          report=['# FLA pilot — simulator Hypervolume (frozen reference)',
                  '',
                  'Pilot settings: population 12, generation budget 12, five paired seeds, five DAG families.',
                  'The reference point is fixed across ALL algorithms and ALL seeds within each workflow.',
                  'The same planned-nondominated candidate selection and simulator replay are applied to all.',
                  'PLANNING-dominated visited schedules are not all replayed: this is not a full simulator Pareto archive.',
                  'Scalar FLA uses three weights and different operators; MLEAO is an unverified reconstruction.',
                  'Evaluation counts differ slightly and are reported separately. Results are exploratory.',
                  '',
                  '| Workflow | Algorithm | Mean simulated HV | HV SD | Wins / 5 |',
                  '|---|---|---:|---:|---:|']
          for wf in sorted(workflows):
              local={a:[x for x in rows if x['workflow']==wf and x['algorithm']==a] for a in algorithms}
              wins={a:0 for a in algorithms}
              for seed in range(1,6):
                  seedrows=[x for x in rows if x['workflow']==wf and x['seed']==seed]
                  maxhv=max(x['sim_hv'] for x in seedrows)
                  for x in seedrows:
                      if abs(x['sim_hv']-maxhv)<1e-9: wins[x['algorithm']]+=1
              for alg in sorted(algorithms):
                  values=[x['sim_hv'] for x in local[alg]]
                  report.append(f'| {wf} | {alg} | {statistics.mean(values):.5f} | {statistics.stdev(values):.5f} | {wins[alg]} |')
          report+=['','## Frozen per-workflow reference points']
          for wf,ref in sorted(refs.items()):
              report.append(f'- {wf}: ({ref[0]:.6f}, {ref[1]:.6f})')
          pathlib.Path('reports/frozen_hv_report.md').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
          cat reports/frozen_hv_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregated cross-seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-frozen-hv-summary-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
