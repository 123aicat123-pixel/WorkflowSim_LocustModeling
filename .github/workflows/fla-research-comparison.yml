name: FLA four-algorithm simulated Pareto pilot

on:
  push:
    branches: [fla-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-pareto-pilot:
    name: Pilot ${{ matrix.workflow }} seed 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_25, Sipht_30, CyberShake_30]
    steps:
      - name: Checkout fla-baseline
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile project from source (not stale bin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/commit.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/source-list.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/source-list.txt 2>&1 | tee ci-logs/compile.log
      - name: Run all four algorithms, replay planned nondominated fronts
        shell: bash
        run: |
          set -euo pipefail
          java -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' 1 12 12 'Output&Results/fla_${{ matrix.workflow }}_seed1' \
            2>&1 | tee ci-logs/fla-research.log
      - name: Assert all algorithms and positive simulation objectives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, math, pathlib
          p=pathlib.Path('Output&Results/fla_${{ matrix.workflow }}_seed1_summary.csv')
          with p.open(newline='') as f: data=list(csv.DictReader(f))
          wanted={'FLA-3W','DAG-Pareto-FLA','NSGA-II','MLEAO'}
          assert {r['algorithm'] for r in data}==wanted, data
          assert len(data)==4
          for row in data:
              assert int(row['evaluations'])>0
              assert 0<int(row['evaluations'])<=int(row['budget_cap'])
              assert int(row['replayed'])>0
              assert float(row['sim_hv'])>=0 and math.isfinite(float(row['sim_hv']))
              assert float(row['planned_hv'])>=0 and math.isfinite(float(row['planned_hv']))
          q=pathlib.Path('Output&Results/fla_${{ matrix.workflow }}_seed1_replays.csv')
          with q.open(newline='') as f: candidates=list(csv.DictReader(f))
          assert len(candidates)==sum(int(r['replayed']) for r in data)
          for row in candidates:
              assert all(math.isfinite(float(row[c])) and float(row[c])>0 for c in
                  ('planned_makespan','planned_cost','sim_makespan','sim_cost'))
          print('PASS pilot',p,'records',len(data),'replays',len(candidates))
          for row in data:
              print(row['algorithm'],'evals',row['evaluations'],'simHV',row['sim_hv'],
                    'planHV',row['planned_hv'],'replayed',row['replayed'])
          PY
      - name: Upload raw research runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-comparison-${{ matrix.workflow }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/fla_${{ matrix.workflow }}_seed1_*
          retention-days: 30
          if-no-files-found: warn
