name: Audit DAG100 online K16 reference-point robustness using frozen real replays
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-online-reference-robustness.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reference-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41597521884
          github-token: ${{ github.token }}
          pattern: causal-factorial100-k16-*-41597521884
          path: originals
      - name: Evaluate three prior-reference multiples from all ten original WorkflowSim artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/fla_online_reference_robustness.py originals reports \
            2>&1 | tee reports/audit.log
          git rev-parse HEAD > reports/analysis_sha.txt
          printf 'Original frozen 100task K16 four-policy simulator source: run 41597521884\n' > reports/original_run.txt
          cat reports/online_ref_robustness_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-reference-robustness-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
