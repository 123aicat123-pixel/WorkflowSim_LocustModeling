name: Final FLA v6 100-task 5-seed combined simulator comparison

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v6-100task-combined.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  frozen-combined-hv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download seeds 1 and 2 from first immutable run
        uses: actions/download-artifact@v4
        with:
          run-id: 41512322414
          github-token: ${{ github.token }}
          pattern: v6-100-*
          path: data/first
          merge-multiple: false
      - name: Download seeds 3–5 from second immutable run
        uses: actions/download-artifact@v4
        with:
          run-id: 41513299770
          github-token: ${{ github.token }}
          pattern: v6-100ext-*
          path: data/extension
          merge-multiple: false
      - name: Verify identical algorithm budgets and recompute FROZEN HV across all five seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import pathlib,csv,math,statistics,collections,random
          first=pathlib.Path('data/first')
          second=pathlib.Path('data/extension')
          p1=list(first.rglob('*_replays.csv'))
          p2=list(second.rglob('*_replays.csv'))
          s1=list(first.rglob('*_summary.csv'))
          s2=list(second.rglob('*_summary.csv'))
          assert (len(p1),len(p2),len(s1),len(s2))==(10,15,10,15),(len(p1),len(p2),len(s1),len(s2))
          workflows=('CyberShake_100','Epigenomics_100','Inspiral_100','Montage_100','Sipht_100')
          algorithms=('DAG-Pareto-FLA[v6-pop]','NSGA-II','FLA-3W','MLEAO')
          group=collections.defaultdict(list)
          for p in p1+p2:
              with p.open(newline='') as f: arr=list(csv.DictReader(f))
              assert arr,p
              for r in arr:
                  wf,alg,seed=r['workflow'],r['algorithm'],int(r['seed'])
                  assert wf in workflows and alg in algorithms and seed in range(1,6)
                  m,c=float(r['sim_makespan']),float(r['sim_cost'])
                  assert math.isfinite(m) and math.isfinite(c) and m>0 and c>0,(wf,alg,seed,m,c)
                  group[(wf,alg,seed)].append((m,c))
          assert len(group)==5*4*5,len(group)
          for wf in workflows:
              for alg in algorithms:
                  assert {s for (w,a,s) in group if w==wf and a==alg}==set(range(1,6))
          summaries=[]
          for p in s1+s2:
              with p.open(newline='') as f:rows=list(csv.DictReader(f))
              assert len(rows)==4,p
              summaries.extend(rows)
          assert len(summaries)==100
          for r in summaries:
              count=int(r['evaluations'])
              assert 2980<=count<=3060 and count==int(r['captured_evaluations'])
              assert int(r['replayed'])==len(group[(r['workflow'],r['algorithm'],int(r['seed']))])
          refs={}
          for wf in workflows:
              pts=[p for (w,_,_),arr in group.items() if w==wf for p in arr]
              refs[wf]=(1.05*max(x for x,_ in pts)+1,1.05*max(y for _,y in pts)+1)
          def nd(points):
              u=sorted(set(points))
              return [p for p in u if not any(q!=p and q[0]<=p[0] and q[1]<=p[1] for q in u)]
          def hv(points,ref):
              tot=0.0
              prev=ref[1]
              for m,c in nd(points):
                  assert m<ref[0] and c<ref[1]
                  if c<prev:
                      tot+=(ref[0]-m)*(prev-c)
                      prev=c
              return tot
          values={(wf,alg,seed):hv(pts,refs[wf]) for (wf,alg,seed),pts in group.items()}
          output=pathlib.Path('reports/100task_5seed_frozen_hv.csv')
          with output.open('w',newline='') as f:
              w=csv.writer(f)
              w.writerow(['workflow','algorithm','seed','sim_hv','ref_m','ref_c','replayed'])
              for key in sorted(values):
                  wf,alg,seed=key
                  w.writerow([wf,alg,seed,f'{values[key]:.10f}',f'{refs[wf][0]:.10f}',
                              f'{refs[wf][1]:.10f}',len(group[key])])
          report=[
              '# FLA v6 complete 100-task scalability test: 5 DAG families x 5 seeds',
              '',
              'Merged immutable evidence from GitHub Actions runs 41512322414 (seeds 1–2) and 41513299770 (seeds 3–5).',
              'The core DAG planner, experimental driver, and stage-in-aware evaluators have identical source blob SHAs across the two run commits.',
              'Each algorithm has approximately 3000 objective evaluations (per-run exact counts checked), matching the same source objective.',
              'One FROZEN simulator-HV reference per workflow is recomputed using all five seeds and all four optimizers.',
              'Candidate replays are PLANNED-nondominated subsets, not exhaustive simulator Pareto sets.',
              '',
              '| Workflow | v6 mean HV | NSGA-II mean HV | FLA-3W mean HV | MLEAO mean HV | v6 wins / 5 |',
              '|---|---:|---:|---:|---:|---:|']
          for wf in workflows:
              means={a:statistics.mean(values[(wf,a,s)] for s in range(1,6)) for a in algorithms}
              wins=sum(abs(values[(wf,algorithms[0],seed)]-max(values[(wf,a,seed)] for a in algorithms))<=1e-9 for seed in range(1,6))
              report.append(f'| {wf} | {means[algorithms[0]]:.4f} | {means[algorithms[1]]:.4f} | {means[algorithms[2]]:.4f} | {means[algorithms[3]]:.4f} | {wins} |')
          report+=['','## Matched relative simulator-HV differences','',
                    '| V6 versus | Mean paired difference (%) | Median difference (%) | V6 better cases | Exploratory workflow-and-seed bootstrap 95% interval (%) |',
                    '|---|---:|---:|---:|---:|']
          for comp in algorithms[1:]:
              byfamily={wf:[100*(values[(wf,algorithms[0],s)]/max(1e-9,values[(wf,comp,s)])-1)
                            for s in range(1,6)] for wf in workflows}
              diffs=[d for wf in workflows for d in byfamily[wf]]
              rng=random.Random(20261103)
              boot=[]
              for t in range(10000):
                  sample_families=[rng.choice(workflows) for _ in workflows]
                  sample=[rng.choice(byfamily[w]) for w in sample_families for i in range(5)]
                  boot.append(statistics.mean(sample))
              boot.sort()
              report.append(f'| {comp} | {statistics.mean(diffs):+.3f} | {statistics.median(diffs):+.3f} | {sum(x>0 for x in diffs)}/25 | [{boot[249]:+.3f}, {boot[9749]:+.3f}] |')
              for wf in workflows:
                  report.append(f'- {wf} versus {comp}: mean {statistics.mean(byfamily[wf]):+.3f}% and {sum(d>0 for d in byfamily[wf])}/5 positive')
          report+=['','## Scientific limits',
                   'This is evidence for five additional workload instances (all 100 tasks), not five independent cloud providers.',
                   'Cluster bootstrap on only five DAG families is exploratory. Do not claim superiority if intervals overlap zero.',
                   'FLA-3W is a disclosed MATLAB-continuous-to-discrete adaptation, MLEAO a reconstruction.',
                   'The chosen benchmark data and VM model do not establish real-cloud validity.',
                   '', '## Frozen reference points']
          report.extend(f'- {wf}: ({refs[wf][0]:.8f}, {refs[wf][1]:.8f})' for wf in workflows)
          pathlib.Path('reports/100task_5seed_report.md').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
          cat reports/100task_5seed_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save final combined five-seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-100task-five-seed-final-${{ github.run_id }}
          path: reports/
          retention-days: 90
