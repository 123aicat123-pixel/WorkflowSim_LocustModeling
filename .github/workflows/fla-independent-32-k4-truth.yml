name: FLA Independent 32 Mapping True K4 Decision Divergence
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-independent-32-k4-truth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-32-mapping-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        workflow: [Inspiral_30, Sipht_30, Epigenomics_100, CyberShake_50]
        vm_profile: [default, staggered]
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes reports
          find sources examples tests -type f -name '*.java' | sort > sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @sources.txt
      - name: Run frozen 32 original same-genotype WorkflowSim predictions and truth
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.readyQueueDiagnostic=true \
            -Ddagfla.fixedTaskTrace=true \
            -Ddagfla.fixedVmReadyPriority=fifo \
            -Dliwsa.vmSpeedProfile='${{ matrix.vm_profile }}' \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAFixedMappingUniverse32 \
            '${{ matrix.workflow }}' reports/same_mapping_true_replays.csv \
            > reports/source.log 2>&1 || { tail -120 reports/source.log; exit 1; }
          python3 - <<'PY'
          import csv,math,pathlib
          p=pathlib.Path("reports")
          with (p/"same_mapping_true_replays.csv").open(newline="") as f:r=list(csv.DictReader(f))
          assert len(r)==32 and len({x["mapping_policy"] for x in r})==32
          assert len({x["task_vm_mapping"] for x in r})==32
          assert all(x["workflow"]=="${{ matrix.workflow }}" and
                     x["vm_profile"]=="${{ matrix.vm_profile }}" and
                     x["seed"]=="1501" for x in r)
          for x in r:
              n=int(x["task_count"])
              m=dict(tuple(map(int,y.split(":"))) for y in x["task_vm_mapping"].split("|"))
              assert set(m)==set(range(1,n+1)) and all(0<=v<16 for v in m.values())
              for c in ("old_planned_makespan","old_planned_cost",
                        "ready_planned_makespan","ready_planned_cost","actual_makespan","actual_cost"):
                  assert math.isfinite(float(x[c])) and float(x[c])>0
          s=(p/"source.log").read_text(errors="replace")
          assert s.count("FROZEN_MAP_UNIVERSE_PASS")==32
          assert "PASS thirty-two disjoint algorithm-independent source genotypes" in s
          print("PASS original 32 fixed TaskID-to-VM mapping true replay identities")
          PY
          printf 'DAG=%s vm_speed=%s seed=1501 actual_priority=fifo mappings=32 selection=none\n' \
            '${{ matrix.workflow }}' '${{ matrix.vm_profile }}' > reports/block-id.txt
          git rev-parse HEAD > reports/source-sha.txt
          cp docs/FLA_INDEPENDENT_32_MAPPING_K4_DIVERGENCE_FROZEN_2026-11-05.md reports/frozen-protocol.md
      - name: Retain every original positive/negative source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-independent32-${{ matrix.workflow }}-${{ matrix.vm_profile }}-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
