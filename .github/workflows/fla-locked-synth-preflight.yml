name: Preflight locked synthetic 40-task DAX parser and real WorkflowSim K16
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-locked-synth-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        topology: [SynthWide_40, SynthDeep_40]
        speed: [default, staggered]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate deterministic DAG and compile current Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/source_sha.txt
          python3 scripts/fla_locked_synthetic_dax.py | tee ci-logs/topology_sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
          java -cp 'build/classes:lib/*' org.workflowsim.examples.planning.VMSpeedProfilesRegressionTest
      - name: Run 80 plan evaluations and EXACT K16 actual replay per solver on locked unseen synthetic shape
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Dliwsa.vmSpeedProfile='${{ matrix.speed }}' \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.topology }}' 120 8 9 \
            'Output&Results/preflight_${{ matrix.topology }}_${{ matrix.speed }}' \
            v12-fair-pair 2>&1 | tee ci-logs/replay.log
          grep -F 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/replay.log
      - name: Verify all tasks simulated and true positive objectives and exact budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,math
          pre=pathlib.Path('Output&Results')/'preflight_${{ matrix.topology }}_${{ matrix.speed }}'
          def read(s):
              with pathlib.Path(str(pre)+s).open(newline='') as f:return list(csv.DictReader(f))
          summary=read('_summary.csv');rr=read('_replays.csv')
          assert len(summary)==3 and len(rr)==48
          assert all(int(x['evaluations'])==int(x['captured_evaluations'])==80 and int(x['replayed'])==16 for x in summary)
          assert all(math.isfinite(float(x['sim_makespan'])) and float(x['sim_makespan'])>0
                     and math.isfinite(float(x['sim_cost'])) and float(x['sim_cost'])>0 for x in rr)
          p=pathlib.Path(str(pre)+'_budget_protocol.txt').read_text()
          assert 'VM_SPEED_PROFILE=${{ matrix.speed }}' in p
          print('PASS synthetic topology actual WorkflowSim positive objectives for 3 solvers × K16')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synth-preflight-${{ matrix.topology }}-${{ matrix.speed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/preflight_${{ matrix.topology }}_${{ matrix.speed }}_*.csv
            config/dax/Synth*.xml
          retention-days: 90
          if-no-files-found: warn
