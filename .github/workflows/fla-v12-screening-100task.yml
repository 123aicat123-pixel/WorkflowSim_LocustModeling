name: v12 and equally seeded NSGA-II 100-task planning-screened HV audit

on:
  push:
    branches: [fla-baseline]
    paths:
      - .github/workflows/fla-v12-screening-100task.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-screening-audit:
    name: Screen bias ${{ matrix.workflow }} s${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_100, CyberShake_100, Sipht_100, Epigenomics_100, Inspiral_100]
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile all current Java files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/commit-sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Run 30x100 same-search-budget screening sensitivity
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.screeningAuditPerAlgorithm=24 \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            'Output&Results/v12screen100_${{ matrix.workflow }}_s${{ matrix.seed }}' \
            v12-fair-pair 2>&1 | tee ci-logs/screening-audit.log
      - name: Confirm nonnegative sensitivity and exact complete observations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,math
          root=pathlib.Path('Output&Results')
          tag='v12screen100_${{ matrix.workflow }}_s${{ matrix.seed }}'
          with (root/(tag+'_summary.csv')).open(newline='') as f:base=list(csv.DictReader(f))
          with (root/(tag+'_screening_summary.csv')).open(newline='') as f:rows=list(csv.DictReader(f))
          with (root/(tag+'_screening_samples.csv')).open(newline='') as f:samples=list(csv.DictReader(f))
          assert len(base)==len(rows)==3
          assert {r['algorithm'] for r in rows}=={
            'DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          assert sum(int(r['sampled']) for r in rows)==len(samples)
          for x in rows:
              assert 0<=int(x['sampled'])<=24
              assert int(x['sampled'])<=int(x['strict_planned_dominated'])
              assert 0<=int(x['non_dominated_vs_base'])<=int(x['sampled'])
              assert math.isfinite(float(x['delta_hv'])) and float(x['delta_hv'])>=0
              assert float(x['extra_sim_hv'])+1e-6>=float(x['baseline_sim_hv'])
          for r in samples:
              assert r['stratum'] in ('near-planned-front','uniform-remainder')
              assert float(r['sim_makespan'])>0 and float(r['sim_cost'])>0
          print('PASS screening audit; additional simulator replays:',len(samples))
          for r in rows:
              print(r['algorithm'],'sampled',r['sampled'],
                'new-ND',r['non_dominated_vs_base'],
                'HV sensitivity',r['delta_hv_pct']+'%')
          PY
      - name: Save full paired and sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12screening100-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/v12screen100_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
            Output&Results/v12screen100_${{ matrix.workflow }}_s${{ matrix.seed }}_limitations.txt
          retention-days: 90
          if-no-files-found: warn
  pooled-report:
    name: Planning-front sensitivity summary
    needs: paired-screening-audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v12screening100-*-${{ github.run_id }}
          path: input
          merge-multiple: false
      - name: Pool 10 cases without conflating HV scales
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import csv,pathlib,statistics,collections
          paths=list(pathlib.Path('input').rglob('*_screening_summary.csv'))
          assert len(paths)==10, f'expected 10 matrices, got {len(paths)}'
          rows=[]
          for p in paths:
              with p.open(newline='') as f:rows+=list(csv.DictReader(f))
          assert len(rows)==30
          algs=sorted({r['algorithm'] for r in rows})
          workflows=sorted({r['workflow'] for r in rows})
          report=['# 100-task planning-nondominated screening sensitivity',
                  '',
                  'Fixed within-run simulator reference across all THREE equally seeded algorithms. Twenty-four extra planning-dominated unique assignments sampled per algorithm, after search, as an audit only.',
                  'Sampling: half nearest to planned front, half deterministic random from remaining strictly planning-dominated assignments.',
                  'Extra simulator evaluations are outside the identical optimization budget; primary HV and benchmark claims remain unchanged.',
                  'Positive extra HV establishes omission bias in the planned-front-replay protocol, NOT a better optimization algorithm.',
                  'This is a sample, not an exhaustive simulator Pareto front. Selection remains biased toward near-front points.',
                  '',
                  '| Workflow | Algorithm | Sampled planning-dominated (total / 2) | Simulator nondominated versus base | Mean extra HV % |',
                  '|---|---|---:|---:|---:|']
          for wf in workflows:
              for a in algs:
                  g=[r for r in rows if r['workflow']==wf and r['algorithm']==a]
                  assert len(g)==2,(wf,a,len(g))
                  sample=sum(int(r['sampled']) for r in g)
                  nd=sum(int(r['non_dominated_vs_base']) for r in g)
                  diff=statistics.mean(float(r['delta_hv_pct']) for r in g)
                  report.append(f'| {wf} | {a} | {sample} | {nd} | {diff:.6f}% |')
          report+=['','## Aggregate by algorithm (ten paired cases)','','| Algorithm | Total extra replays | New nondominated candidates | Mean HV sensitivity % |',
                   '|---|---:|---:|---:|']
          for a in algs:
              g=[r for r in rows if r['algorithm']==a]
              assert len(g)==10
              report.append(f'| {a} | {sum(int(r["sampled"]) for r in g)} | {sum(int(r["non_dominated_vs_base"]) for r in g)} | {statistics.mean(float(r["delta_hv_pct"]) for r in g):.6f}% |')
          with pathlib.Path('reports/v12screening100_sensitivity.md').open('w') as f:
              f.write('\n'.join(report)+'\n')
          with pathlib.Path('reports/v12screening100_sensitivity.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]))
              w.writeheader();w.writerows(rows)
          print('\n'.join(report))
          PY
          cat reports/v12screening100_sensitivity.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12screening100-pooled-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
