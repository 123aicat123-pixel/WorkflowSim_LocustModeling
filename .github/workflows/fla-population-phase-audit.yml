name: FLA DO EO SSO true selected breeding population passive diagnostic
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-population-phase-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: population ${{ matrix.dag }} ${{ matrix.speed }} seed${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dag: [Montage_25, CyberShake_30]
        speed: [default, staggered]
        seed: [173, 174]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile exact diagnostic and verify pure counters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD > ci-logs/source_sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.FLAPopulationDiagnosticsTest
      - name: Run six unchanged optimizer arms with passive selected-population trace
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.populationDiagnostics=true \
            -Dliwsa.vmSpeedProfile='${{ matrix.speed }}' \
            -Dliwsa.vmPriceProfile=default \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.dag }}' '${{ matrix.seed }}' 30 100 \
            "Output&Results/phase-pop-${{ matrix.speed }}-${{ matrix.dag }}-s${{ matrix.seed }}" \
            population-mechanism-fivearm 2>&1 | tee ci-logs/experiment.log
          test "$(grep -c 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/experiment.log)" -eq 5
          python3 - <<'PY'
          import csv,pathlib
          base=pathlib.Path("Output&Results/phase-pop-${{ matrix.speed }}-${{ matrix.dag }}-s${{ matrix.seed }}")
          with pathlib.Path(str(base)+"_summary.csv").open(newline="") as f:s=list(csv.DictReader(f))
          with pathlib.Path(str(base)+"_population_diagnostics.csv").open(newline="") as f:d=list(csv.DictReader(f))
          with pathlib.Path(str(base)+"_replays.csv").open(newline="") as f:r=list(csv.DictReader(f))
          assert len(s)==6 and len(d)==505 and len(r)==96,(len(s),len(d),len(r))
          assert all(int(x["evaluations"])==int(x["captured_evaluations"])==3030 and int(x["replayed"])==16 for x in s)
          assert len({x["algorithm"] for x in d})==5
          assert all(0<=float(x["pairwise_hamming_all"])<=1 for x in d)
          assert all(int(float(x["selected_unique"]))+int(float(x["selected_duplicate_slots"]))==30 for x in d)
          print("PASS 5x101 exact selected breeding-population snapshots, all six arms 3030 calls K16 actual WorkflowSim and identical cost seeds")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fla-phase-pop-${{ matrix.dag }}-${{ matrix.speed }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/*_population_diagnostics.csv
            Output&Results/*_summary.csv
            Output&Results/*_replays.csv
            Output&Results/*_budget_protocol.txt
          retention-days: 90
  report:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fla-phase-pop-*-${{ github.run_id }}
          path: original
      - name: Report exact selected breeding-population phase mechanisms and true K16 outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_phase_population_report.py
          python3 scripts/fla_phase_population_report.py original reports | tee reports/analysis.log
          git rev-parse HEAD > reports/source_sha.txt
          cat reports/phase_population_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fla-phase-pop-report-${{ github.run_id }}
          path: reports
          retention-days: 90
