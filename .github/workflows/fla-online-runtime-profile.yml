name: Verify policy selection and real WorkflowSim runtime instrumentation
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-online-runtime-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile source and preserve SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes logs 'Output&Results'
          git rev-parse HEAD | tee logs/source_sha.txt
          find sources examples tests -name '*.java' -type f | sort > logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @logs/sources.txt 2>&1 | tee logs/compile.log
      - name: Compare four K16 modes under identical 80-planner fitness budget
        shell: bash
        run: |
          set -euo pipefail
          for policy in pareto-cover online-planned-hv online-observed-hv online-nearest-hv; do
            java -Dworkflowsim.planningStageInAware=true \
              -Ddagfla.budgetReplayK=16 -Ddagfla.budgetReplayPolicy="$policy" \
              -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
              Montage_25 97 8 9 "Output&Results/time-$policy" v12-fair-pair \
              2>&1 | tee "logs/$policy.log"
            grep -F 'PASS identical first TWO task->VM deterministic cost seeds' "logs/$policy.log"
          done
      - name: Strict timing schema, counts, source hashes and totals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,math
          root=pathlib.Path('Output&Results')
          hashes=[]
          policies=('pareto-cover','online-planned-hv','online-observed-hv','online-nearest-hv')
          for policy in policies:
              prefix=root/('time-'+policy)
              def read(s):
                  with pathlib.Path(str(prefix)+s).open(newline='') as f:return list(csv.DictReader(f))
              summary=read('_summary.csv')
              fp=read('_visited_fingerprints.csv')
              assert len(summary)==len(fp)==3
              hashes.append({r['algorithm']:r['history_sha256'] for r in fp})
              for r in summary:
                  assert int(r['evaluations'])==int(r['captured_evaluations'])==80
                  assert int(r['replayed'])==16
                  search=float(r['search_ms']);selection=float(r['selection_ms']);replay=float(r['replay_ms'])
                  total=float(r['search_selection_replay_ms'])
                  assert all(math.isfinite(x) and x>=0 for x in (search,selection,replay,total))
                  assert replay>0
                  assert abs(search+selection+replay-total)<0.003,(policy,r)
                  print(policy,r['algorithm'],'search_ms',search,'selector_ms',selection,'simulator_ms',replay)
          assert all(a==hashes[0] for a in hashes)
          print('PASS all three solver histories SHA match and all four runtime fields reconcile')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-runtime-profile-${{ github.run_id }}
          path: |
            logs/
            Output&Results/time-*_summary.csv
            Output&Results/time-*_replays.csv
            Output&Results/time-*_visited_fingerprints.csv
          retention-days: 90
          if-no-files-found: warn
