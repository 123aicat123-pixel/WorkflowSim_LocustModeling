name: Read-only Fixed-Task Parent Release vs VM Waiting
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-parent-release-vs-wait.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable original actual simulator events
        uses: actions/download-artifact@v4
        with:
          run-id: 41664213940
          github-token: ${{ github.token }}
          pattern: fla-event-chain-*-41664213940
          path: original
      - name: Independently split predicted DAG release from VM-ready waiting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_fixed_event_chain_audit.py scripts/fla_parent_release_vs_wait_audit.py
          python3 scripts/fla_parent_release_vs_wait_audit.py original config/dax reports | tee reports/stdout.log
          git rev-parse HEAD > reports/analysis-source-sha.txt
          echo 'Original real simulator source Actions: 41664213940' > reports/immutable-source.txt
          cat reports/release_wait_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all 1176 read-only task-level decompositions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-parent-release-vs-wait-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: error
