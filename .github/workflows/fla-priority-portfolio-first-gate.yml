name: FLA Priority Portfolio vs FIFO Equal-3030 Genotype and K16 True-HV
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-priority-portfolio-first-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-fla-nsga:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workflow: [CyberShake_30, Sipht_30]
        seed: [711, 712]
        treatment: [old, ready, portfolio_fifo, portfolio_shortest, portfolio_upward]
    steps:
      - uses: actions/checkout@v4
      - name: Clean Java build and deterministic scheduler regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes reports 'Output&Results'
          find sources examples tests -type f -name '*.java' | sort > sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @sources.txt
          java -cp 'build/classes:lib/*' org.workflowsim.planning.ReadyQueuePriorityForecastTest > reports/ready-priority-oracle.log
          java -cp 'build/classes:lib/*' org.workflowsim.scheduling.FLAFixedVmReadyPriorityTest > reports/runtime-queue-oracle.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.StageInAwareEvaluatorTest > reports/stagein-oracle.log
      - name: Execute fixed-budget fair solver pair and prospective actual simulator replay budget
        shell: bash
        run: |
          set -euo pipefail
          treatment='${{ matrix.treatment }}'
          pop=30
          replay_k=16
          ready=false
          policy_aware=false
          runtime=fifo
          case "$treatment" in
            old) ;;
            ready) ready=true ;;
            portfolio_fifo) pop=10; replay_k=6; ready=true; policy_aware=true; runtime=fifo ;;
            portfolio_shortest) pop=10; replay_k=5; ready=true; policy_aware=true; runtime=shortest ;;
            portfolio_upward) pop=10; replay_k=5; ready=true; policy_aware=true; runtime=upward ;;
            *) echo "Unregistered frozen treatment" >&2; exit 1 ;;
          esac
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.useReadyQueueObjective="$ready" \
            -Ddagfla.priorityAwareSearch="$policy_aware" \
            -Ddagfla.fixedVmReadyPriority="$runtime" \
            -Ddagfla.dualModelMode=off \
            -Ddagfla.budgetReplayK="$replay_k" \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -Dliwsa.vmSpeedProfile=default \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' "$pop" 100 \
            reports/research v12-nsga-ready-pair > reports/experiment.log 2>&1 || {
              tail -90 reports/experiment.log
              exit 1
            }
          test -s reports/research_summary.csv
          test -s reports/research_replays.csv
          python3 - <<PY
          import csv,math
          def read(path):
              with open(path,newline='') as f:return list(csv.DictReader(f))
          summary=read('reports/research_summary.csv')
          replay=read('reports/research_replays.csv')
          pop=int("$pop");k=int("$replay_k");expected=pop*101
          assert len(summary)==2 and len(replay)==2*k,(len(summary),len(replay))
          arms={'DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          assert {s['algorithm'] for s in summary}==arms
          for s in summary:
              assert (int(s['population']),int(s['generations']),int(s['evaluations']),
                      int(s['captured_evaluations']),int(s['replayed']))==(pop,100,expected,expected,k),s
              z=[r for r in replay if r['algorithm']==s['algorithm']]
              assert len(z)==k and len({r['mapping'] for r in z})==k
              assert [int(r['candidate_index']) for r in z]==list(range(1,k+1)),s
              assert all(math.isfinite(float(r[x])) and float(r[x])>0 for r in z for x in
                         ('sim_makespan','sim_cost','planned_makespan','planned_cost'))
          print('PASS EXACT fair FLA/NSGA-II genotype evaluation budget per arm',expected,
                'and true WorkflowSim replay budget',k)
          PY
          printf 'DAG=%s seed=%s treatment=%s runtime_priority=%s pop=%s K=%s\n' \
             '${{ matrix.workflow }}' '${{ matrix.seed }}' "$treatment" "$runtime" "$pop" "$replay_k" \
             > reports/block-id.txt
          git rev-parse HEAD > reports/source-sha.txt
          cp docs/FLA_PRIORITY_PORTFOLIO_FIRST_GATE_PROTOCOL_2026-11-04.md reports/frozen-protocol.md
      - name: Archive all source K-limited actual simulator cases and search times
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fla-priority-portfolio-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ matrix.treatment }}-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
