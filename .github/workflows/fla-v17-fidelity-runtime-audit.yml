name: v17 Read-only Planned-vs-Simulator Fidelity and Search Runtime
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v17-fidelity-runtime-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41626382711
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: v17-confirm-*-41626382711
          path: original/real
      - uses: actions/download-artifact@v4
        with:
          run-id: 41631739331
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: v17-synthetic-*-41631739331
          path: original/synthetic
      - name: Calculate paired original K16 planning-simulator error and runtime descriptors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_v17_fidelity_runtime_audit.py
          python3 scripts/fla_v17_fidelity_runtime_audit.py original reports | tee reports/analysis.log
          git rev-parse HEAD > reports/analysis_sha.txt
          cat reports/v17_fidelity_runtime_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v17-fidelity-runtime-${{ github.run_id }}
          path: reports
          retention-days: 90
