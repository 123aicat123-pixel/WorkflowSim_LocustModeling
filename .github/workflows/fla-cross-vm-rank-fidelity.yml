name: Pinned real K16 heterogeneous VM planner versus simulator rank-fidelity audit
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-cross-vm-rank-fidelity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rank-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve all exact completed 20 per-case WorkflowSim artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 41603751878
          github-token: ${{ github.token }}
          pattern: crossvm-*-41603751878
          path: originals
      - name: Quantify selected-K16 planner/simulator Kendall ties, reversals and objective error
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/fla_cross_vm_rank_fidelity.py originals reports 2>&1 | tee reports/audit.log
          git rev-parse HEAD > reports/source_sha.txt
          printf '%s\n' 'Original actual WorkflowSim cross-VM run 41603751878' > reports/source_run.txt
          cat reports/speed_rank_fidelity_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossvm-rank-fidelity-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
