name: Verify FLA v10 critical relocation actually changes evaluated genotypes

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/dag-fla-v10-activation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile all current Java code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes logs 'Output&Results'
          git rev-parse HEAD | tee logs/sha.txt
          find sources examples tests -type f -name '*.java' | sort > logs/java-sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @logs/java-sources.txt 2>&1 | tee logs/compile.log
      - name: Compare active versus default-OFF edge operators in exact simulator
        shell: bash
        run: |
          set -euo pipefail
          for variant in v7-costseed v10-critical v10-guarded; do
            java -Dworkflowsim.planningStageInAware=true -cp 'build/classes:lib/*' \
              org.workflowsim.examples.planning.FLAResearchExperiment \
              Montage_25 1234 8 6 "Output&Results/activation_${variant}" "${variant}" \
              2>&1 | tee "logs/${variant}.log"
          done
      - name: Assert every operator actually modifies task-to-VM assignments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,re
          for variant in ('v7-costseed','v10-critical','v10-guarded'):
              log=pathlib.Path('logs/'+variant+'.log').read_text()
              matches=re.findall(r'DAG-Pareto-FLA:.*?criticalRelocationChanges=(\d+)',log)
              assert len(matches)==1,(variant,matches)
              changes=int(matches[0])
              assert changes==0 if variant=='v7-costseed' else changes>0,(variant,changes)
              with pathlib.Path('Output&Results/activation_'+variant+'_summary.csv').open(newline='') as f:
                  summary=list(csv.DictReader(f))
              assert len(summary)==1 and int(summary[0]['evaluations'])==int(summary[0]['captured_evaluations'])==56
              print(variant,'actual critical-path gene changes',changes,'fitness calls',summary[0]['evaluations'])
          print('PASS: v10 critical-path mutations are nontrivial and within the same fitness budget')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-operator-activation-${{ github.run_id }}
          path: |
            logs/
            Output&Results/activation_*_summary.csv
            Output&Results/activation_*_replays.csv
          retention-days: 90
          if-no-files-found: warn
