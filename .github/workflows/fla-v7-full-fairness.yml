name: Full v7 versus matched cost-seeded NSGA-II five-family fairness audit

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v7-full-fairness.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    name: Matched-seed pair ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_100, Sipht_100, CyberShake_100, Epigenomics_100, Inspiral_100]
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java fresh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/head.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/javac.log
      - name: Same low-cost seeds, same 3030 evaluations, two different optimizers
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            'Output&Results/fairfull_${{ matrix.workflow }}_s${{ matrix.seed }}' fair-pair \
            2>&1 | tee ci-logs/paired-optimizers.log
      - name: Assert exact budgets, assignment replays and independent planned objectives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,math
          root=pathlib.Path('Output&Results')
          pre='fairfull_${{ matrix.workflow }}_s${{ matrix.seed }}'
          with (root/(pre+'_summary.csv')).open(newline='') as f:rows=list(csv.DictReader(f))
          with (root/(pre+'_replays.csv')).open(newline='') as f:replays=list(csv.DictReader(f))
          assert len(rows)==2
          expected={'DAG-Pareto-FLA[v7-costseed]','NSGA-II[costseed]'}
          assert {r['algorithm'] for r in rows}==expected
          assert len(replays)==sum(int(r['replayed']) for r in rows)
          for r in rows:
              assert int(r['evaluations'])==int(r['captured_evaluations'])==3030,r
              assert int(r['replayed'])>0
          for r in replays:
              assert r['algorithm'] in expected
              for field in ('sim_makespan','sim_cost','planned_makespan','planned_cost',
                            'independent_planned_makespan','independent_planned_cost'):
                  assert math.isfinite(float(r[field])) and float(r[field])>0,r
              assert abs(float(r['planned_makespan'])-float(r['independent_planned_makespan']))<=1e-6*max(1.0,float(r['independent_planned_makespan']))
              assert abs(float(r['planned_cost'])-float(r['independent_planned_cost']))<=1e-6*max(1.0,float(r['independent_planned_cost']))
          print('PASS same-costseed fairness pair, 3030 evaluations each, replayed',len(replays))
          PY
      - name: Upload actual simulator outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairfull-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/fairfull_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    name: Frozen-HV paired seed fairness across all 100-task DAGs
    needs: pair
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fairfull-*-${{ github.run_id }}
          path: inputs
          merge-multiple: false
      - name: Recompute one shared frozen reference per family and family uncertainty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import csv,pathlib,collections,statistics,random,itertools
          root=pathlib.Path('inputs')
          replays=list(root.rglob('*_replays.csv'))
          summaries=list(root.rglob('*_summary.csv'))
          assert len(replays)==len(summaries)==25,(len(replays),len(summaries))
          group=collections.defaultdict(list)
          workflows=('CyberShake_100','Epigenomics_100','Inspiral_100','Montage_100','Sipht_100')
          algs=('DAG-Pareto-FLA[v7-costseed]','NSGA-II[costseed]')
          for p in replays:
              with p.open(newline='') as f:rows=list(csv.DictReader(f))
              assert rows,p
              for r in rows:
                  wf,alg,seed=r['workflow'],r['algorithm'],int(r['seed'])
                  assert wf in workflows and alg in algs and seed in range(1,6)
                  group[(wf,alg,seed)].append((float(r['sim_makespan']),float(r['sim_cost'])))
          assert len(group)==50
          for p in summaries:
              with p.open(newline='') as f:rows=list(csv.DictReader(f))
              assert len(rows)==2
              for r in rows:
                  assert int(r['evaluations'])==int(r['captured_evaluations'])==3030
                  assert int(r['replayed'])==len(group[(r['workflow'],r['algorithm'],int(r['seed']))])
          def nd(points):
              xs=sorted(set(points))
              return [x for x in xs if not any(q!=x and q[0]<=x[0] and q[1]<=x[1] for q in xs)]
          def hv(points,ref):
              prev=ref[1];area=0
              for m,c in nd(points):
                  if m>=ref[0] or c>=ref[1]:continue
                  if c<prev:
                      area+=(ref[0]-m)*(prev-c)
                      prev=c
              return area
          refs={}
          for wf in workflows:
              pts=[p for (w,a,s),arr in group.items() if w==wf for p in arr]
              refs[wf]=(1.05*max(x for x,y in pts)+1,1.05*max(y for x,y in pts)+1)
          values={(w,a,s):hv(arr,refs[w]) for (w,a,s),arr in group.items()}
          data=[]
          for w in workflows:
              for seed in range(1,6):
                  for a in algs:
                      data.append(dict(workflow=w,seed=seed,algorithm=a,sim_hv=values[(w,a,seed)],
                            ref_m=refs[w][0],ref_c=refs[w][1],replayed=len(group[(w,a,seed)])))
          diffs={w:[100*(values[(w,algs[0],s)]/max(1e-12,values[(w,algs[1],s)])-1)
                     for s in range(1,6)] for w in workflows}
          per=[x for w in workflows for x in diffs[w]]
          means=[statistics.mean(diffs[w]) for w in workflows]
          rng=random.Random(20261103)
          boot=sorted(statistics.mean([rng.choice(means) for _ in workflows]) for t in range(20000))
          obs=statistics.mean(means)
          signflips=[statistics.mean([a*b for a,b in zip(signs,means)])
                     for signs in itertools.product((-1,1),repeat=len(workflows))]
          p=sum(abs(x)>=abs(obs)-1e-12 for x in signflips)/len(signflips)
          report=['# FULL 25-pair equal-cost-seed FLA v7 versus NSGA-II fairness result',
                  '',
                  'Both algorithms receive identical two deterministic low-cost initialization proposals, each uses 3030 actual objective evaluations.',
                  '25 paired runs across five 100-task DAG families and five seeds, same stage-in-aware planning objective, actual WorkflowSim replay.',
                  'Shared 1.05-worst-observed frozen simulator HV reference within each family across both algorithms and all seeds.',
                  'This is a controlled cost-seeding counterfactual; NSGA-II[costseed] is a modified version, not its unseeded canonical baseline.',
                  'Planning-dominated evaluated schedules were not exhaustively simulated, and the same workflow families were examined during method development.',
                  '',
                  '| Workflow | Mean v7 HV | Mean costseed NSGA-II HV | Mean paired relative v7 % | V7 wins |',
                  '|---|---:|---:|---:|---:|']
          for w in workflows:
              v=statistics.mean(values[(w,algs[0],s)] for s in range(1,6))
              n=statistics.mean(values[(w,algs[1],s)] for s in range(1,6))
              report.append(f'| {w} | {v:.4f} | {n:.4f} | {statistics.mean(diffs[w]):+.3f}% | {sum(x>0 for x in diffs[w])}/5 |')
          report+=['',
                    f'All 25 pairs: v7 relative to matched costseed NSGA-II = {statistics.mean(per):+.3f}% mean paired HV, {sum(x>0 for x in per)}/25 wins.',
                    f'Family-clustered percentile bootstrap 95% interval: [{boot[499]:+.3f}%, {boot[19499]:+.3f}%].',
                    f'Exact five-family sign-flip two-sided p = {p:.4f} (exploratory; family samples are few).',
                    '',
                    '## Frozen reference points']
          for w in workflows:report.append(f'- {w}: ({refs[w][0]:.8f}, {refs[w][1]:.8f})')
          pathlib.Path('reports/fairfull_report.md').write_text('\n'.join(report)+'\n')
          with pathlib.Path('reports/fairfull_hv.csv').open('w',newline='') as f:
              z=csv.DictWriter(f,fieldnames=list(data[0]));z.writeheader();z.writerows(data)
          print('\n'.join(report))
          PY
          cat reports/fairfull_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fairfull-final-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
