name: Cost-seeded FLA v7 versus NSGA-II under synthetic VM price regimes

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v7-vm-price-stress.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-optimizer-pairs:
    name: Price ${{ matrix.price }} ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        price: [linear, convex]
        workflow: [Montage_100, CyberShake_100, Sipht_100]
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build current branch from source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
          java -cp 'build/classes:lib/*' org.workflowsim.examples.planning.VMPriceProfilesRegressionTest
      - name: Equal-cost initialization FLA and NSGA-II on alternate VM price scenario
        shell: bash
        run: |
          set -euo pipefail
          java -Dliwsa.vmPriceProfile='${{ matrix.price }}' \
            -Dworkflowsim.planningStageInAware=true \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            'Output&Results/price_${{ matrix.price }}_${{ matrix.workflow }}_s${{ matrix.seed }}' fair-pair \
            2>&1 | tee ci-logs/paired-price-search.log
          grep -F 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/paired-price-search.log
      - name: Assert objective parity and all actual replayed candidate objectives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,math
          pre='price_${{ matrix.price }}_${{ matrix.workflow }}_s${{ matrix.seed }}'
          root=pathlib.Path('Output&Results')
          with (root/(pre+'_summary.csv')).open(newline='') as f:summary=list(csv.DictReader(f))
          with (root/(pre+'_replays.csv')).open(newline='') as f:replays=list(csv.DictReader(f))
          assert len(summary)==2
          assert {r['algorithm'] for r in summary}=={'DAG-Pareto-FLA[v7-costseed]','NSGA-II[costseed]'}
          assert all(int(r['evaluations'])==int(r['captured_evaluations'])==3030 for r in summary)
          assert len(replays)==sum(int(r['replayed']) for r in summary)
          for r in replays:
              assert math.isfinite(float(r['sim_makespan'])) and float(r['sim_makespan'])>0
              assert math.isfinite(float(r['sim_cost'])) and float(r['sim_cost'])>0
              for obj in ('makespan','cost'):
                  a=float(r['planned_'+obj]);b=float(r['independent_planned_'+obj])
                  assert abs(a-b)<=1e-6*max(1.0,abs(b))
          print('PASS equal search budgets and correct simulated replay under ${{ matrix.price }} prices')
          PY
      - name: Upload full simulation and price evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coststress-${{ matrix.price }}-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/price_${{ matrix.price }}_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    name: Frozen simulated HV per price profile and DAG
    needs: matched-optimizer-pairs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coststress-*-${{ github.run_id }}
          path: inputs
          merge-multiple: false
      - name: Compare fair solvers under each price regime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import pathlib,csv,collections,statistics,random
          files=list(pathlib.Path('inputs').rglob('*_replays.csv'))
          summaries=list(pathlib.Path('inputs').rglob('*_summary.csv'))
          assert len(files)==len(summaries)==18,(len(files),len(summaries))
          group=collections.defaultdict(list)
          profiles=['linear','convex']
          workflows=['CyberShake_100','Montage_100','Sipht_100']
          algs=['DAG-Pareto-FLA[v7-costseed]','NSGA-II[costseed]']
          for p in files:
              with p.open(newline='') as f:records=list(csv.DictReader(f))
              assert records
              path=str(p)
              profile='convex' if 'price_convex_' in path else 'linear'
              assert ('price_'+profile+'_') in path
              for r in records:
                  wf,alg,seed=r['workflow'],r['algorithm'],int(r['seed'])
                  assert wf in workflows and alg in algs and seed in (1,2,3)
                  group[(profile,wf,alg,seed)].append((float(r['sim_makespan']),float(r['sim_cost'])))
          assert len(group)==2*3*2*3
          for p in summaries:
              with p.open(newline='') as f:rows=list(csv.DictReader(f))
              assert len(rows)==2
              for r in rows:
                  assert int(r['evaluations'])==int(r['captured_evaluations'])==3030
          def nd(points):
              u=sorted(set(points))
              return [p for p in u if not any(q!=p and q[0]<=p[0] and q[1]<=p[1] for q in u)]
          def hv(points,ref):
              total=0.;prev=ref[1]
              for m,c in nd(points):
                  if m>=ref[0] or c>=ref[1]:continue
                  if c<prev:
                      total+=(ref[0]-m)*(prev-c);prev=c
              return total
          values={};refs={}
          for profile in profiles:
              for wf in workflows:
                  pts=[p for (pr,wf0,alg,seed),arr in group.items()
                       if pr==profile and wf0==wf for p in arr]
                  assert pts
                  refs[(profile,wf)]=(max(x for x,_ in pts)*1.05+1,max(y for _,y in pts)*1.05+1)
                  for a in algs:
                      for seed in (1,2,3):
                          values[(profile,wf,a,seed)]=hv(group[(profile,wf,a,seed)],refs[(profile,wf)])
          report=['# Equal-initialization FLA-v7 / NSGA-II synthetic VM price-stress test',
                  '',
                  'Profiles are synthetic scenario choices, NOT measured prices for cloud providers.',
                  'Original benchmark VM rates (0.15,0.30,0.60,0.90) remain the untouched default.',
                  'Linear profile: 0.15*(MIPS/250); convex profile: 0.15*(MIPS/250)^1.5.',
                  'Both solvers received identical first two deterministic cost-seed mappings, 3030 actual fitness evaluations and independent WorkflowSim replays.',
                  'Reference points are shared per price profile and per DAG across both algorithms and seeds. HV cannot be compared in absolute units across profiles.',
                  'Replayed candidates were planned-nondominated selections, not exhaustive simulator Pareto fronts.',
                  '',
                  '| Price profile | DAG family | Mean paired v7 vs costseed NSGA-II HV % | V7 wins / 3 |',
                  '|---|---|---:|---:|']
          raw=[]
          for profile in profiles:
              pooled=[]
              for wf in workflows:
                  differences=[]
                  for seed in (1,2,3):
                      v=values[(profile,wf,algs[0],seed)]
                      n=values[(profile,wf,algs[1],seed)]
                      differences.append(100*(v/max(1e-12,n)-1))
                      for a in algs:
                          raw.append(dict(profile=profile,workflow=wf,seed=seed,algorithm=a,
                                          sim_hv=values[(profile,wf,a,seed)],
                                          ref_m=refs[(profile,wf)][0],ref_c=refs[(profile,wf)][1]))
                  pooled+=differences
                  report.append(f'| {profile} | {wf} | {statistics.mean(differences):+.3f}% | {sum(x>0 for x in differences)}/3 |')
              report.append(f'**{profile}: pooled {statistics.mean(pooled):+.3f}% mean across 9 pairs, {sum(x>0 for x in pooled)}/9 wins.**')
          report+=['','Only 3 families and 3 seeds per profile were tested; this is a targeted stress test, not a new independent workload-family benchmark.']
          with pathlib.Path('reports/price_stress_hv.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(raw[0]));w.writeheader();w.writerows(raw)
          pathlib.Path('reports/price_stress.md').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
          cat reports/price_stress.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v7-price-stress-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
