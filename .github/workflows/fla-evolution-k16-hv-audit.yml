name: Independent Prospective K16 All-512 Real HV Audit
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-evolution-k16-hv-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-source-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exactly 16 original K16 source artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 41816731197
          github-token: ${{ github.token }}
          pattern: fla-evolution-k16-*-41816731197
          path: original
      - name: Fail closed on incomplete source; independently compute actual K16 HV at common reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_evolution_k16_new_seed_actual_hv_audit.py
          python3 scripts/fla_evolution_k16_new_seed_actual_hv_audit.py original reports | tee reports/audit.log
          git rev-parse HEAD > reports/audit-source-sha.txt
          echo 'Original frozen source: 41816731197' > reports/original-run.txt
          cp docs/FLA_EVOLUTION_FIDELITY_K16_NEW_SEEDS_FROZEN_2026-11-04.md reports/frozen-protocol.md
          cat reports/source_results_and_limitations.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive all positive and adverse actual simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-evolution-k16-independent-audit-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: error
