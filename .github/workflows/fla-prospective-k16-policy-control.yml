name: Equal K16 prospective Pareto coverage versus random FLA control
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-prospective-k16-policy-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Cover vs random ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_25, Inspiral_50, CyberShake_100]
        seed: [53, 54]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile fresh sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/source-sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Two independent 3030-eval and K16 real-WorkflowSim runs
        shell: bash
        run: |
          set -euo pipefail
          for policy in pareto-cover random; do
            java -Dworkflowsim.planningStageInAware=true \
              -Ddagfla.budgetReplayK=16 \
              -Ddagfla.budgetReplayPolicy="$policy" \
              -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
              '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
              "Output&Results/control_${{ matrix.workflow }}_s${{ matrix.seed }}_$policy" v12-fair-pair \
              2>&1 | tee "ci-logs/$policy.log"
            grep -F 'PASS identical first TWO task->VM deterministic cost seeds' "ci-logs/$policy.log"
          done
      - name: Assert budgets and actual replays for every algorithm and policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,collections,math
          root=pathlib.Path('Output&Results')
          base='control_${{ matrix.workflow }}_s${{ matrix.seed }}_'
          names={'DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          prev={}
          for policy in ('pareto-cover','random'):
              p=root/(base+policy)
              with pathlib.Path(str(p)+'_summary.csv').open(newline='') as f:summary=list(csv.DictReader(f))
              with pathlib.Path(str(p)+'_replays.csv').open(newline='') as f:replays=list(csv.DictReader(f))
              assert len(summary)==3 and {r['algorithm'] for r in summary}==names
              assert len(replays)==48 and collections.Counter(r['algorithm'] for r in replays)=={n:16 for n in names}
              assert all(int(r['evaluations'])==int(r['captured_evaluations'])==3030 and int(r['replayed'])==16 for r in summary)
              for r in replays:
                  assert math.isfinite(float(r['sim_makespan'])) and float(r['sim_makespan'])>0
                  assert math.isfinite(float(r['sim_cost'])) and float(r['sim_cost'])>0
              protocol=pathlib.Path(str(p)+'_budget_protocol.txt').read_text()
              assert 'PROSPECTIVE_REPLAY_BUDGET_K=16' in protocol
              assert 'PROSPECTIVE_REPLAY_POLICY='+policy in protocol
              for r in summary:
                  k=r['algorithm']; distinct=int(r['distinct_observed'])
                  if k in prev:assert prev[k]==distinct,(k,policy)
                  prev[k]=distinct
          print('PASS equal actual budgets: 3030 planning evaluations + 16 true WorkflowSim replays x 2 policies x 3 solvers')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k16-policy-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/control_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
            Output&Results/control_${{ matrix.workflow }}_s${{ matrix.seed }}_*_budget_protocol.txt
          retention-days: 90
          if-no-files-found: error
