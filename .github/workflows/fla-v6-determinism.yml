name: FLA v6 seeded reproducibility and exact simulator replay test

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v6-determinism.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeded-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile once from authoritative source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Repeat an identical seeded v6 population search in clean Java processes
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            java -Dworkflowsim.planningStageInAware=true -cp 'build/classes:lib/*' \
              org.workflowsim.examples.planning.FLAResearchExperiment \
              Montage_25 1777 12 12 "Output&Results/determinism_${i}" v6-pop \
              2>&1 | tee "ci-logs/run_${i}.log"
          done
          diff -u 'Output&Results/determinism_1_replays.csv' 'Output&Results/determinism_2_replays.csv' \
            | tee ci-logs/replay-diff.log
          python3 - <<'PY'
          import csv
          a=[]
          for i in (1,2):
              with open(f'Output&Results/determinism_{i}_summary.csv',newline='') as f:r=list(csv.DictReader(f))
              assert len(r)==1
              assert r[0]['algorithm']=='DAG-Pareto-FLA[v6-pop]'
              assert int(r[0]['evaluations'])==int(r[0]['captured_evaluations'])==156
              a.append(r[0])
          stable=['workflow','seed','population','generations','evaluations','replayed',
                  'distinct_observed','sim_nondominated','sim_hv','planned_hv',
                  'sim_ref_m','sim_ref_c','plan_ref_m','plan_ref_c']
          for k in stable:assert a[0][k]==a[1][k],(k,a[0][k],a[1][k])
          print('PASS: seeded v6 produces byte-identical candidate assignments and identical simulated HV')
          PY
      - name: Save deterministic verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-repeatability-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/determinism_*_summary.csv
            Output&Results/determinism_*_replays.csv
          if-no-files-found: warn
          retention-days: 60
