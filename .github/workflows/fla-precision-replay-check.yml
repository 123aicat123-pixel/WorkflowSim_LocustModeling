name: Full-precision offline-vs-prospective FLA budget identity audit
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-precision-replay-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Precision identity ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_25, CyberShake_30]
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile full source and record SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD > ci-logs/source-sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Build full-history simulation oracle with full precision source CSV
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.screeningAuditPerAlgorithm=256 \
            -Ddagfla.screeningAuditIncludeTies=true \
            -Ddagfla.screeningAuditAllVisited=true \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 8 9 \
            'Output&Results/prec_full_${{ matrix.workflow }}_s${{ matrix.seed }}' \
            v12-fair-pair 2>&1 | tee ci-logs/full.log
      - name: Actual prospective K=16 simulation without full history replays
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.budgetReplayK=16 \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 8 9 \
            'Output&Results/prec_k16_${{ matrix.workflow }}_s${{ matrix.seed }}' \
            v12-fair-pair 2>&1 | tee ci-logs/k16.log
      - name: Assert exact same selected genotypes and simulated objectives between the modes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys,csv,pathlib,importlib.util,math,collections
          spec=importlib.util.spec_from_file_location('audit','scripts/fla_replay_budget_audit.py')
          m=importlib.util.module_from_spec(spec)
          sys.modules['audit']=m
          spec.loader.exec_module(m)
          root=pathlib.Path('Output&Results')
          name='${{ matrix.workflow }}_s${{ matrix.seed }}'
          def read(prefix,suffix):
              with (root/(prefix+name+suffix)).open(newline='') as f:return list(csv.DictReader(f))
          full=read('prec_full_','_replays.csv')+read('prec_full_','_screening_samples.csv')
          limited=read('prec_k16_','_replays.csv')
          summary=read('prec_k16_','_summary.csv')
          assert len(limited)==48 and len(summary)==3
          assert all(int(r['evaluations'])==int(r['captured_evaluations'])==80 and int(r['replayed'])==16 for r in summary)
          wf,seed='${{ matrix.workflow }}',int('${{ matrix.seed }}')
          for alg in m.SOLVERS:
              f=[r for r in full if r['algorithm']==alg]
              l=[r for r in limited if r['algorithm']==alg]
              assert len(l)==16
              items=[m.Planned(r['mapping'],float(r['planned_makespan']),float(r['planned_cost'])) for r in f]
              assert len(items)==len({i.mapping for i in items})
              exact=[r['mapping'] for r in l]
              proposed=[x.mapping for x in m.choose(items,(wf,seed,alg),'pareto-cover',16,0)]
              # Replay order is not an optimization objective. In a near-tie,
              # two numerically equal-distance schedules may be emitted in
              # opposite order without changing the selected K-set or its HV.
              assert len(set(proposed))==len(set(exact))==16
              assert set(proposed)==set(exact),('SELECTION SET MISMATCH',wf,seed,alg,
                  len(set(proposed)&set(exact)))
              if proposed!=exact:
                  print('NOTE same K=16 assignments, different within-set ordering:',wf,seed,alg)
              oracle={r['mapping']:r for r in f}
              for r in l:
                  o=oracle[r['mapping']]
                  for metric in ('sim_makespan','sim_cost','planned_makespan','planned_cost'):
                      a=float(r[metric]);b=float(o[metric])
                      assert abs(a-b)<=1e-8*max(1,abs(b)),(wf,seed,alg,metric,a,b)
              print('PASS exact Python-vs-Java planned-only K16 selected schedule identity:',wf,seed,alg)
          print('PASS 48 real K16 replay objective matches, without simulated-label screening')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-matching-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/prec_full_${{ matrix.workflow }}_s${{ matrix.seed }}_*
            Output&Results/prec_k16_${{ matrix.workflow }}_s${{ matrix.seed }}_*
          retention-days: 90
