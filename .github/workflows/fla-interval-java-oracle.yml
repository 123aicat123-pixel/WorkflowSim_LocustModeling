name: FLA Pure Interval Pareto Certificate Java Test
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-interval-java-oracle.yml', 'tests/org/workflowsim/planning/IntervalParetoCertificatePropertyTest.java', 'sources/org/workflowsim/planning/FailClosedFidelityGate.java', 'tests/org/workflowsim/planning/FailClosedFidelityGateTest.java', 'sources/org/workflowsim/planning/WorkflowFailClosedProbe.java', 'tests/org/workflowsim/planning/WorkflowFailClosedProbeTest.java', 'examples/org/workflowsim/examples/planning/FLAResearchExperiment.java', 'scripts/fla_fail_closed_probe_audit.py', 'scripts/fla_fail_closed_probe_nonintrusion_audit.py', 'scripts/fla_fail_closed_audit_negative_controls.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-oracle-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Java sources and run conservative interval geometry oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes reports
          find sources examples tests -type f -name '*.java' | sort > sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @sources.txt
          java -cp 'build/classes:lib/*' org.workflowsim.planning.IntervalParetoCertificateTest | tee reports/interval-oracle.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.IntervalParetoCertificatePropertyTest | tee reports/interval-property-oracle.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.FailClosedFidelityGateTest | tee reports/fail-closed-ready-gate.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.WorkflowFailClosedProbeTest | tee reports/workflow-fail-closed-probe.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.BudgetedEvolutionFidelityObjectiveTest | tee reports/cache-original-regression.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.ReadyQueueScheduleEvaluatorTest | tee reports/ready-original-regression.log
          test "$(grep -h -c '^PASS ' reports/*.log | awk -F: '{s+=$NF}END{print s}')" -eq 6
          # Synthetic negative controls: must reject tampered reports before any real run.
          python3 scripts/fla_fail_closed_audit_negative_controls.py \
            | tee reports/probe-audit-negative-controls.log
          # Experimental opt-in only: 2 original solvers, K2 physical simulator replays each.
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.stagedReplayContext=true \
            -Ddagfla.budgetReplayK=2 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -Ddagfla.failClosedProbePairs=2 \
            -Ddagfla.failClosedProbeReadyBudget=2 \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            Montage_25 801 8 6 reports/probe_montage v12-nsga-ready-pair \
            > reports/probe-montage.log 2>&1
          python3 scripts/fla_fail_closed_probe_audit.py \
            reports/probe_montage --log reports/probe-montage.log \
            --pairs 2 --ready-budget 2 --tasks 25 --k 2 --expected-evals 56
          # Independent A/B control: same original seed, algorithm and K2 physical replays.
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.stagedReplayContext=true \
            -Ddagfla.budgetReplayK=2 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            Montage_25 801 8 6 reports/control_montage v12-nsga-ready-pair \
            > reports/control-montage.log 2>&1
          python3 scripts/fla_fail_closed_probe_nonintrusion_audit.py \
            reports/probe_montage reports/control_montage 2 \
            | tee reports/nonintrusion-audit.log
          git rev-parse HEAD > reports/java-source-sha.txt
          printf 'K2 WorkflowSim smoke replays are diagnostic only; no calibrated uncertainty or performance improvement claim\n' > reports/scientific-scope.txt
      - name: Archive original regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-interval-java-oracle-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: error
