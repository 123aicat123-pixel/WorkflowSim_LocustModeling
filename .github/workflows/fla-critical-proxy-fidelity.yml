name: Measure critical-path proxy fidelity against stage-in-aware planned makespan

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-critical-proxy-fidelity.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-fidelity:
    name: Proxy error ${{ matrix.workflow }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_100, CyberShake_100, Sipht_100]
        variant: [v10-critical, v10-guarded]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile current Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Run identical 630-fitness-evaluation probe
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' 77 30 20 \
            'Output&Results/proxy_${{ matrix.workflow }}_${{ matrix.variant }}' \
            '${{ matrix.variant }}' 2>&1 | tee ci-logs/proxy.log
      - name: Assert rank and bias diagnostics are observed without extra fitness calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,csv,math
          raw=pathlib.Path('ci-logs/proxy.log').read_text()
          line=re.findall(r'FLA_CRITICAL_PROXY_AUDIT samples=(\d+) pearson=([+-]?[\d.eE-]+) medianAbsolutePctError=([\d.eE+-]+)%',raw)
          assert len(line)==1,line
          n,r,e=line[0];n=int(n);r=float(r);e=float(e)
          assert n==600,(n,r,e)
          assert math.isfinite(r) and -1.000001<=r<=1.000001
          assert math.isfinite(e) and e>=0
          path=pathlib.Path('Output&Results/proxy_${{ matrix.workflow }}_${{ matrix.variant }}_summary.csv')
          with path.open(newline='') as f:row=list(csv.DictReader(f))
          assert len(row)==1 and int(row[0]['evaluations'])==int(row[0]['captured_evaluations'])==630
          print('PASS proxy fidelity diagnostic, samples=',n,'Pearson=',r,'median absolute relative error %=',e)
          with pathlib.Path('ci-logs/proxy_metrics.csv').open('w') as f:
              f.write('workflow,variant,samples,pearson,median_absolute_pct_error,fitness_evaluations\n')
              f.write('${{ matrix.workflow }},${{ matrix.variant }},%d,%.9f,%.9f,630\n'%(n,r,e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-${{ matrix.workflow }}-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/proxy_${{ matrix.workflow }}_${{ matrix.variant }}_*.csv
          retention-days: 90
  aggregate:
    name: Summarize actual proxy relative error and correlations
    needs: proxy-fidelity
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: proxy-*-${{ github.run_id }}
          path: input
          merge-multiple: false
      - name: Collect all six calibration diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import pathlib,csv
          paths=list(pathlib.Path('input').rglob('proxy_metrics.csv'))
          assert len(paths)==6,(len(paths),paths)
          rows=[]
          for p in paths:
              with p.open(newline='') as f:rows+=list(csv.DictReader(f))
          assert len(rows)==6
          report=['# FLA v10 cheap critical-path proxy versus true stage-in-aware makespan',
                  '',
                  'Population 30, 20 generations, six independently run 100-task probes, seed 77.',
                  'Each run has 630 true objective evaluations and 600 proxy/true pairs on the offspring.',
                  'The proxy is cheap and approximate; it does not model true idle-slot insertion, file-cache reuse or full datacenter dynamics.',
                  'Pearson correlation alone does not establish valid local ranking, causal operator performance, or simulator fidelity.',
                  '',
                  '| DAG | Variant | Pearson correlation | Median absolute relative planned-makespan error |',
                  '|---|---|---:|---:|']
          for r in sorted(rows,key=lambda x:(x['workflow'],x['variant'])):
              report.append(f'| {r["workflow"]} | {r["variant"]} | {float(r["pearson"]):+.4f} | {float(r["median_absolute_pct_error"]):.3f}% |')
          pathlib.Path('reports/proxy_fidelity.md').write_text('\n'.join(report)+'\n')
          with pathlib.Path('reports/proxy_fidelity.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          print('\n'.join(report))
          PY
          cat reports/proxy_fidelity.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-fidelity-summary-${{ github.run_id }}
          path: reports/
          retention-days: 90
