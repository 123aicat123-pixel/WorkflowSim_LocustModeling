name: FLA NSGA Matched Cache Evolution Fidelity K8
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-evolution-cache-matched.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workflow: [CyberShake_50, Sipht_60]
        seed: [801, 802]
        treatment: [old-cached, ready-cached, periodic, risk]
    steps:
      - uses: actions/checkout@v4
      - name: Clean Java build and four-mode shared genotype cache regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes reports 'Output&Results'
          find sources examples tests -type f -name '*.java' | sort > sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @sources.txt
          java -cp 'build/classes:lib/*' org.workflowsim.planning.BudgetedEvolutionFidelityObjectiveTest > reports/cache-budget-unit.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.StageInAwareEvaluatorTest > reports/old-decoder-unit.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.ReadyQueueScheduleEvaluatorTest > reports/ready-decoder-unit.log
      - name: Original FLA and seeded NSGA-II fitness search with exact identical first-write genotype cache
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.useReadyQueueObjective=false \
            -Ddagfla.evolutionFidelity='${{ matrix.treatment }}' \
            -Ddagfla.evolutionTotalVisits=3030 \
            -Ddagfla.evolutionReadyBudget=378 \
            -Ddagfla.dualModelMode=off \
            -Ddagfla.fixedVmReadyPriority=fifo \
            -Ddagfla.budgetReplayK=8 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -Dliwsa.vmSpeedProfile=default \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            reports/research v12-nsga-ready-pair > reports/experiment.log 2>&1 || {
              tail -110 reports/experiment.log
              exit 1
            }
          python3 - <<'PY'
          import csv,math,pathlib
          p=pathlib.Path('reports')
          def read(name):
              with (p/name).open(newline='') as f:return list(csv.DictReader(f))
          summaries=read('research_summary.csv')
          sim=read('research_replays.csv')
          trace=read('research_evolution_fidelity.csv')
          arms={'DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          mode='${{ matrix.treatment }}'
          assert len(summaries)==len(trace)==2 and len(sim)==16
          assert {x['algorithm'] for x in summaries}==arms
          assert {x['algorithm'] for x in trace}==arms
          for s in summaries:
              assert s['workflow']=='${{ matrix.workflow }}' and s['seed']=='${{ matrix.seed }}'
              assert (int(s['population']),int(s['generations']),
                      int(s['evaluations']),int(s['captured_evaluations']),
                      int(s['replayed']))==(30,100,3030,3030,8),s
              rows=[r for r in sim if r['algorithm']==s['algorithm']]
              assert len(rows)==8 and len({r['mapping'] for r in rows})==8
              assert all(math.isfinite(float(r[z])) and float(r[z])>0
                      for r in rows for z in ('sim_makespan','sim_cost','planned_makespan','planned_cost'))
          for t in trace:
              assert t['mode']==mode,t
              visits=int(t['visits']);cheap=int(t['cheap_calls'])
              ready=int(t['ready_calls']);hits=int(t['cache_hits'])
              distinct=int(t['distinct']);quota=int(t['ready_budget'])
              assert visits==3030 and distinct+hits==visits
              assert 0<=cheap<=distinct and 0<=ready<=distinct and 0<=ready<=quota
              if mode=='old-cached':
                  assert quota==0 and cheap==distinct and ready==0
              elif mode=='ready-cached':
                  assert quota==3030 and cheap==0 and ready==distinct
              else:
                  assert quota==378 and cheap==distinct and ready<=378
          print('PASS four comparable first-write cache modes',mode)
          PY
          printf 'DAG=%s seed=%s mode=%s K=8 visits=3030 VM=default\n' \
             '${{ matrix.workflow }}' '${{ matrix.seed }}' '${{ matrix.treatment }}' > reports/block-id.txt
          git rev-parse HEAD > reports/source-sha.txt
          cp docs/FLA_EVOLUTION_FIDELITY_CACHE_MATCHED_FROZEN_2026-11-04.md reports/frozen-protocol.md
      - name: Preserve real simulator truth and cache / physical compute budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-cache-matched-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ matrix.treatment }}-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
