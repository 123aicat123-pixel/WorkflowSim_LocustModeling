name: v14 Counted Stage-In Timeline Local Search vs Random and NSGA-II K16
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v14-timeline-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: v14 ${{ matrix.workflow }} ${{ matrix.speed }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        workflow: [CyberShake_50, Montage_50, Sipht_60]
        speed: [default, staggered]
        seed: [151, 152]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and verify one-call stage-in timeline semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/source_sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
          java -Dworkflowsim.planningStageInAware=true -cp 'build/classes:lib/*' org.workflowsim.planning.TimelineParetoNeighborTest
          java -cp 'build/classes:lib/*' org.workflowsim.planning.DecoderInsertionRegressionTest
      - name: Compare four matched optimizer arms using the exact same objective budget and K16 actual simulator
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Dliwsa.vmSpeedProfile='${{ matrix.speed }}' \
            -Dliwsa.vmPriceProfile=default \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            "Output&Results/v14-search-${{ matrix.speed }}-${{ matrix.workflow }}-s${{ matrix.seed }}" \
            v14-search-fourarm 2>&1 | tee ci-logs/search.log
          test "$(grep -c 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/search.log)" -eq 3
          python3 - <<'PY'
          import re,pathlib,csv
          log=pathlib.Path("ci-logs/search.log").read_text()
          matches=re.findall(r'FLA_PAIRED_LOCAL mode=(\d+) trials=(\d+) changed=(\d+) dominates=(\d+) dominated=(\d+) incomparable=(\d+) evaluations=(\d+)',log)
          assert len(matches)==2,matches
          assert {int(x[0]) for x in matches}=={1,2}
          for fields in matches:
              mode,trials,changed,win,lose,other,evals=map(int,fields)
              assert trials==1400 and changed<=trials and win+lose+other==trials and evals==3030,fields
          p=pathlib.Path("Output&Results/v14-search-${{ matrix.speed }}-${{ matrix.workflow }}-s${{ matrix.seed }}")
          with pathlib.Path(str(p)+"_summary.csv").open(newline="") as f:s=list(csv.DictReader(f))
          with pathlib.Path(str(p)+"_replays.csv").open(newline="") as f:r=list(csv.DictReader(f))
          assert len(s)==4 and len(r)==64
          assert all(int(x["evaluations"])==int(x["captured_evaluations"])==3030 and int(x["replayed"])==16 for x in s)
          assert {x["algorithm"] for x in s}=={"DAG-Pareto-FLA[v12-hvbandit]","DAG-Pareto-FLA[v14-randompair]","DAG-Pareto-FLA[v14-timelinepair]","NSGA-II[costseed]"}
          print("PASS v14 1400 counted local pairs per variant, same 3030 evaluations, matched cost seeds and four K16 simulated fronts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-search-${{ matrix.workflow }}-${{ matrix.speed }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/*_summary.csv
            Output&Results/*_replays.csv
            Output&Results/*_visited_fingerprints.csv
            Output&Results/*_budget_protocol.txt
          retention-days: 90
  report:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v14-search-*-${{ github.run_id }}
          path: inputs
      - name: Check all 12 paired 4-way actual WorkflowSim fronts, local counters and planned-only HV refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/fla_v14_search_report.py inputs reports | tee reports/analysis.log
          git rev-parse HEAD > reports/report_source_sha.txt
          cat reports/v14_search_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-search-report-${{ github.run_id }}
          path: reports
          retention-days: 90
