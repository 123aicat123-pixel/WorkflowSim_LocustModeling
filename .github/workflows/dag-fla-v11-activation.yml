name: Verify v11 FLA phase-aware Pareto feedback bandit is active and budget neutral

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/dag-fla-v11-activation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile fresh Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes logs 'Output&Results'
          git rev-parse HEAD | tee logs/source-sha.txt
          find sources examples tests -type f -name '*.java' | sort > logs/java.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @logs/java.txt 2>&1 | tee logs/compile.log
      - name: Execute baseline and adaptive FLA under exactly same evaluation budget
        shell: bash
        run: |
          set -euo pipefail
          for v in v7-costseed v11-bandit; do
            java -Dworkflowsim.planningStageInAware=true -cp 'build/classes:lib/*' \
              org.workflowsim.examples.planning.FLAResearchExperiment \
              Montage_25 1234 8 6 "Output&Results/bandit_${v}" "${v}" \
              2>&1 | tee "logs/${v}.log"
          done
      - name: Assert adaptive modes activated with three distinct arms and no extra fitness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,re
          b=pathlib.Path('logs/v7-costseed.log').read_text()
          a=pathlib.Path('logs/v11-bandit.log').read_text()
          assert 'FLA_PHASE_BANDIT' not in b
          m=re.findall(r'FLA_PHASE_BANDIT usesBaseline=(\d+) usesColocate=(\d+) usesCritical=(\d+) archiveAdmissionsBaseline=(\d+) archiveAdmissionsColocate=(\d+) archiveAdmissionsCritical=(\d+)',a)
          assert len(m)==1,m
          n=list(map(int,m[0]))
          assert sum(n[:3])==48,n
          assert all(x>0 for x in n[:3]),n
          assert all(0<=y<=x for x,y in zip(n[:3],n[3:])),n
          for v in ('v7-costseed','v11-bandit'):
              with pathlib.Path('Output&Results/bandit_'+v+'_summary.csv').open(newline='') as f:
                  data=list(csv.DictReader(f))
              assert len(data)==1
              assert int(data[0]['evaluations'])==int(data[0]['captured_evaluations'])==56
              assert int(data[0]['replayed'])>0
          print('PASS UCB bandit true admission feedback, three active arms and identical 56-call budget',n)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-bandit-activation-${{ github.run_id }}
          path: |
            logs/
            Output&Results/bandit_*_summary.csv
            Output&Results/bandit_*_replays.csv
          retention-days: 90
