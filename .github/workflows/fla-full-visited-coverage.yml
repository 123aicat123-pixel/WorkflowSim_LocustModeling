name: FLA Full Visited Pareto Objective Coverage Pilot
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-full-visited-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-with-passive-export:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        workflow: [Montage_50, Sipht_60]
        seed: [981, 982]
    steps:
      - uses: actions/checkout@v4
      - name: Compile source and exact decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes reports
          find sources examples tests -type f -name '*.java' | sort > sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @sources.txt
          java -cp 'build/classes:lib/*' org.workflowsim.planning.StageInAwareEvaluatorTest > reports/stagein-unit.log
      - name: Original FLA and NSGA paired full-visited planned export with exactly K16 real replays
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.useReadyQueueObjective=false \
            -Ddagfla.dualModelMode=off \
            -Ddagfla.exportVisitedObjectiveSpace=true \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -Dliwsa.vmSpeedProfile=default \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 reports/research v12-nsga-ready-pair \
            > reports/experiment.log 2>&1 || {
              tail -120 reports/experiment.log
              exit 1
            }
          python3 - <<'PY'
          import csv,pathlib
          path=pathlib.Path('reports')
          def read(name):
              with (path/name).open(newline='') as f:return list(csv.DictReader(f))
          summary=read('research_summary.csv')
          traces=read('research_full_visited_objectives.csv')
          fingerprints=read('research_visited_fingerprints.csv')
          assert len(summary)==len(fingerprints)==2
          assert len(read('research_replays.csv'))==32
          assert {s['algorithm'] for s in summary}=={
            'DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          for s in summary:
              assert int(s['evaluations'])==int(s['captured_evaluations'])==3030
              assert int(s['replayed'])==16
              v=[x for x in traces if x['algorithm']==s['algorithm']]
              assert len(v)==int(s['distinct_observed'])
          log=(path/'experiment.log').read_text(errors='replace')
          assert log.count('PASS PRE_REPLAY_VISITED_OBJECTIVES')==2
          print('PASS passive source export and K16 original replay integrity')
          PY
          git rev-parse HEAD > reports/source-sha.txt
          cp docs/FLA_VISITED_OBJECTIVE_COVERAGE_FROZEN_2026-11-05.md reports/frozen-protocol.md
      - name: Archive original source even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fla-visited-coverage-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
