name: Independent Same-Genotype 96 Real WorkflowSim Pareto Rank Audit
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-independent-same-mapping-hv-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-only-six-source-blocks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download all six original same-genotype StageIn and READY actual source jobs
        uses: actions/download-artifact@v4
        with:
          run-id: 41695356307
          github-token: ${{ github.token }}
          pattern: fla-algorithm-independent-*-41695356307
          path: original
      - name: Compute 96-same-genotype true Pareto ranking and practical misordering with one reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_algorithm_independent_same_mapping_rank_audit.py
          python3 scripts/fla_algorithm_independent_same_mapping_rank_audit.py original reports | tee reports/stdout.log
          git rev-parse HEAD > reports/audit-source-sha.txt
          printf 'Original independent-of-optimizer actual WorkflowSim 96-run cohort: 41695356307\n' > reports/original-run-id.txt
          cat reports/same_genotype_actual_rank_fidelity_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive every original physical genotype/real objective and negative Pareto comparison
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fla-independent-same-mapping-rank-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: error

# Rerun read-only only after fixing duplicate-workflow keyword; original 96 simulators immutable.
