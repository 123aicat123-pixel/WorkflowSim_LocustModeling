name: Exhaustive visited-assignment simulator Pareto replay (small budget)

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-screening-exhaustive.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    name: Exhaustive ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_25, CyberShake_30, Sipht_30]
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile current Java sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/commit.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Replay every distinct evaluated genotype, including planned ties
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.comparisonVariant=v6-pop \
            -Ddagfla.screeningAuditPerAlgorithm=100 \
            -Ddagfla.screeningAuditIncludeTies=true \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 8 9 \
            'Output&Results/exact_${{ matrix.workflow }}_s${{ matrix.seed }}' \
            2>&1 | tee ci-logs/exact-replay.log
      - name: Verify exhaustive coverage and nonnegative exact HV correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,math
          root=pathlib.Path('Output&Results')
          prefix='exact_${{ matrix.workflow }}_s${{ matrix.seed }}'
          def read(s):
              with (root/(prefix+s)).open(newline='') as f:return list(csv.DictReader(f))
          main=read('_summary.csv')
          audit=read('_screening_summary.csv')
          base=read('_replays.csv')
          replays=read('_screening_samples.csv')
          assert len(main)==len(audit)==4
          assert {x['algorithm'] for x in main}=={
             'DAG-Pareto-FLA[v6-pop]','FLA-3W','NSGA-II','MLEAO'}
          assert len(base)==sum(int(x['replayed']) for x in main)
          assert len(replays)==sum(int(x['sampled']) for x in audit)
          for a in audit:
              assert int(a['sampled'])==int(a['strict_planned_dominated'])+int(a['planned_tie_pool']),a
              same=next(m for m in main if m['algorithm']==a['algorithm'])
              assert int(a['unique_visited'])==int(a['sampled'])+int(same['replayed']),a
              assert int(same['captured_evaluations'])<=100
              assert 0<=int(a['non_dominated_vs_base'])<=int(a['sampled'])
              assert float(a['extra_sim_hv'])+1e-6>=float(a['baseline_sim_hv'])
              assert math.isfinite(float(a['delta_hv_pct']))
          print('PASS: FULL distinct genotype replay for all four algorithms; records',len(base)+len(replays))
          for a in audit:
              print(a['algorithm'],'unique',a['unique_visited'],
                    'sampled',a['sampled'],'planned-ties',a['planned_tie_pool'],
                    'missed-nd',a['non_dominated_vs_base'],'extra-HV%',a['delta_hv_pct'])
          PY
      - name: Preserve all raw decisions and objective values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-screening-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/exact_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
            Output&Results/exact_${{ matrix.workflow }}_s${{ matrix.seed }}_limitations.txt
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    name: Exhaustive simulator-front bias and winner-change report
    if: always()
    needs: exhaustive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-screening-*-${{ github.run_id }}
          path: input
          merge-multiple: false
      - name: Reconcile full replay coverage and compare primary vs exhaustive ranking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import pathlib,csv,statistics,collections
          root=pathlib.Path('input')
          data=list(root.rglob('*_screening_summary.csv'))
          assert len(data)==6,(len(data),data)
          runs=[]
          for p in data:
              with p.open(newline='') as f:runs+=list(csv.DictReader(f))
          assert len(runs)==24
          bycase=collections.defaultdict(list)
          for r in runs:
              key=(r['workflow'],int(r['seed']))
              bycase[key].append(r)
          assert len(bycase)==6 and all(len(g)==4 for g in bycase.values())
          report=[
            '# Fully replayed simulator Pareto front of the VISITED solution set',
            '',
            'Exhaustive only for this deliberately small optimization budget: population 8, generations 9, 4 algorithms, 3 DAG families, 2 paired seeds.',
            'All unique visited assignments were replayed: planned-nondominated candidates plus strictly dominated candidates and distinct assignments with tied planned objectives.',
            'This is the exact simulator Pareto front OVER EVALUATED GENOTYPES, not the global scheduling optimum.',
            'The same pre-audit simulator HV reference is preserved within each workflow/seed and solver comparison.',
            'Additional simulator replays occur AFTER search and do not count toward or change optimizer fitness evaluations.',
            '',
            '| Workflow | Seed | Baseline best HV solver | Exhaustive best HV solver | Rank winner changed? |',
            '|---|---:|---|---|---|'
          ]
          flips=0
          for (wf,seed),g in sorted(bycase.items()):
              a=max(g,key=lambda x:float(x['baseline_sim_hv']))['algorithm']
              b=max(g,key=lambda x:float(x['extra_sim_hv']))['algorithm']
              flips+=a!=b
              report.append(f'| {wf} | {seed} | {a} | {b} | {a!=b} |')
          report+=['',f'Winner changed in {flips}/6 paired cases.','','| Algorithm | Mean HV increase % | Cases with positive extra HV | Total missed simulator non-dominated vs original |',
                   '|---|---:|---:|---:|']
          algs=sorted({r['algorithm'] for r in runs})
          for alg in algs:
              g=[x for x in runs if x['algorithm']==alg]
              vals=[float(x['delta_hv_pct']) for x in g]
              report.append(f'| {alg} | {statistics.mean(vals):.6f} | {sum(v>1e-12 for v in vals)}/6 | {sum(int(x["non_dominated_vs_base"]) for x in g)} |')
          report+=['','## Limitations',
                   'This diagnostic proves the effect of planning-dominance screening at small budgets only.',
                   'Do not extrapolate the six exact-replay cases to the 30x100 or 100-task studies without additional evidence.',
                   'The reference point is frozen before adding dominated samples; solutions outside the reference do not contribute HV.']
          pathlib.Path('reports/full_visited_front_report.md').write_text('\n'.join(report)+'\n')
          with pathlib.Path('reports/full_visited_front_raw.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(runs[0]))
              w.writeheader();w.writerows(runs)
          print('\n'.join(report))
          PY
          cat reports/full_visited_front_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-screening-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
