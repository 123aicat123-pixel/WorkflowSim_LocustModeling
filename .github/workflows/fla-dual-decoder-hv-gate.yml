name: FLA Dual-Decoder Mean Worst True-HV Falsification
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-dual-decoder-hv-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-model:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workflow: [Sipht_60, Montage_100]
        seed: [211, 212]
        mode: [mean, worst]
    steps:
      - uses: actions/checkout@v4
      - name: Clean full Java build and both counterexample oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes reports 'Output&Results'
          find sources examples tests -type f -name '*.java' | sort > sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @sources.txt
          java -cp 'build/classes:lib/*' org.workflowsim.planning.ReadyQueueScheduleEvaluatorTest > reports/ready-queue-oracle.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.DualModelScheduleObjectiveTest > reports/dual-model-oracle.log
          java -cp 'build/classes:lib/*' org.workflowsim.planning.StageInAwareEvaluatorTest > reports/stagein-oracle.log
      - name: Execute 3030-evaluation exact-cost-seed FLA and NSGA-II K16 replays
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.dualModelMode='${{ matrix.mode }}' \
            -Ddagfla.useReadyQueueObjective=false \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -Dliwsa.vmSpeedProfile=default \
            -cp 'build/classes:lib/*' \
            org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            reports/research v12-nsga-ready-pair > reports/experiment.log 2>&1 || {
              tail -90 reports/experiment.log
              exit 1
            }
          test -s reports/research_summary.csv
          test -s reports/research_replays.csv
          python3 - <<'PY'
          import csv,math
          def read(path):
            with open(path,newline='') as f:return list(csv.DictReader(f))
          s=read('reports/research_summary.csv')
          r=read('reports/research_replays.csv')
          assert len(s)==2 and len(r)==32,(len(s),len(r))
          assert set(x['algorithm'] for x in s)=={'DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          for arm in s:
            assert int(arm['evaluations'])==3030 and int(arm['captured_evaluations'])==3030 and int(arm['replayed'])==16,arm
            group=[x for x in r if x['algorithm']==arm['algorithm']]
            assert len(group)==16 and len({x['mapping'] for x in group})==16
            assert [int(x['candidate_index']) for x in group]==list(range(1,17))
            assert all(math.isfinite(float(x[k])) and float(x[k])>0 for x in group for k in ('sim_makespan','sim_cost','planned_makespan','planned_cost'))
          print('PASS both solvers 3030 actual optimizer decodes and 16 independently simulated unique assignments each')
          PY
          printf 'DAG=%s seed=%s decoder=%s\n' '${{ matrix.workflow }}' '${{ matrix.seed }}' '${{ matrix.mode }}' > reports/block-id.txt
          git rev-parse HEAD > reports/source-sha.txt
          cp docs/FLA_DUAL_DECODER_SEARCH_FROZEN_PROTOCOL_2026-11-04.md reports/frozen-protocol.md
      - name: Archive true simulation outcomes and negative cases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fla-dual-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ matrix.mode }}-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
