name: Pinned cross-VM FLA v12 versus NSGA-II solver comparison across HV references
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-cross-vm-solver-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve fixed source-scored reference analysis, without resimulation
        uses: actions/download-artifact@v4
        with:
          run-id: 41604765542
          github-token: ${{ github.token }}
          pattern: crossvm-reference-audit-41604765542
          path: original-report
      - name: Compare same-budget FLA and NSGA-II on every reference and retain negative results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/fla_cross_vm_solver_gate.py original-report reports 2>&1 | tee reports/audit.log
          git rev-parse HEAD > reports/analysis_sha.txt
          printf '%s\n' 'Original real WorkflowSim source run: 41603751878' 'Pinned independent reference-scale audit: 41604765542' > reports/provenance.txt
          cat reports/solver_vm_reference_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossvm-solver-gate-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
