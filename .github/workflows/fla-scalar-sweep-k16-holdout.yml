name: Five-family prospective K16 Pareto-cover versus scalar sweep frozen-reference test
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-scalar-sweep-k16-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Frozen K16 pair ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        workflow: [CyberShake_100, Epigenomics_100, Inspiral_100, Montage_100, Sipht_100]
        seed: [61, 62, 63]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile source at one immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD > ci-logs/source-sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Run Pareto coverage with real K16 simulator replays
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=pareto-cover \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            'Output&Results/pareto-cover_${{ matrix.workflow }}_s${{ matrix.seed }}' \
            v12-fair-pair 2>&1 | tee ci-logs/cover.log
          grep -F 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/cover.log
          test "$(grep -c 'PASS prospective planned-only replay selection K=16' ci-logs/cover.log)" -eq 3
      - name: Run extreme-first scalar sweep at EXACT same K
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.budgetReplayK=16 \
            -Ddagfla.budgetReplayPolicy=scalar-sweep \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            'Output&Results/scalar-sweep_${{ matrix.workflow }}_s${{ matrix.seed }}' \
            v12-fair-pair 2>&1 | tee ci-logs/scalar-sweep.log
          grep -F 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/scalar-sweep.log
          test "$(grep -c 'PASS prospective planned-only scalar-sweep replay selection K=16' ci-logs/random.log)" -eq 3
      - name: Assert same optimizer histories and true simulator budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,math,collections
          base=pathlib.Path('Output&Results')
          end='${{ matrix.workflow }}_s${{ matrix.seed }}'
          names={'DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          datasets={}
          for policy in ('pareto-cover_','scalar-sweep_'):
              prefix=base/(policy+end)
              def read(s):
                  with (pathlib.Path(str(prefix)+s)).open(newline='') as f:return list(csv.DictReader(f))
              summary=read('_summary.csv')
              sim=read('_replays.csv')
              assert len(summary)==3 and {r['algorithm'] for r in summary}==names
              assert len(sim)==48 and {r['algorithm'] for r in sim}==names
              assert all(int(r['evaluations'])==int(r['captured_evaluations'])==3030 and int(r['replayed'])==16 for r in summary)
              assert all(collections.Counter(r['algorithm'] for r in sim)[n]==16 for n in names)
              for r in sim:
                  assert all(math.isfinite(float(r[k])) and float(r[k])>0 for k in ('sim_makespan','sim_cost'))
                  for obj in ('makespan','cost'):
                      p=float(r['planned_'+obj]);q=float(r['independent_planned_'+obj])
                      assert abs(p-q)<=1e-6*max(1,abs(q))
              assert pathlib.Path(str(prefix)+'_budget_protocol.txt').read_text().find('PROSPECTIVE_REPLAY_BUDGET_K=16')>=0
              datasets[policy]={r['algorithm']:(r['source_archive'],r['distinct_observed'],r['distinct_planned_nondominated']) for r in summary}
          assert datasets['pareto-cover_']==datasets['scalar-sweep_']
          print('PASS two true K16 simulator budgets, identical per-solver 3030-search histories and independently checked objectives')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweepK16-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/pareto-cover_${{ matrix.workflow }}_s${{ matrix.seed }}_*
            Output&Results/scalar-sweep_${{ matrix.workflow }}_s${{ matrix.seed }}_*
          retention-days: 90
  report:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sweepK16-*-${{ github.run_id }}
          path: input
      - name: Evaluate frozen prior-study HV references, extreme points and paired rankings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/fla_scalar_sweep_control.py input reports 2>&1 | tee reports/audit.log
          git rev-parse HEAD > reports/source-sha.txt
          cat reports/scalar_k16_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweepK16-report-${{ github.run_id }}
          path: reports
          retention-days: 90
