name: v12 exact visited-front fair audit
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v12-exact-visited.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        workflow: [Montage_25, CyberShake_30, Sipht_30]
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Same-seed v7 v12 NSGA-II and full-history independent simulator replay
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -Ddagfla.screeningAuditPerAlgorithm=256 \
            -Ddagfla.screeningAuditIncludeTies=true \
            -Ddagfla.screeningAuditAllVisited=true \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 8 9 \
            'Output&Results/exactv12_${{ matrix.workflow }}_s${{ matrix.seed }}' v12-fair-pair \
            2>&1 | tee ci-logs/run.log
          grep -F 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/run.log
      - name: Check complete visited coverage and objective budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,pathlib,math
          prefix='exactv12_${{ matrix.workflow }}_s${{ matrix.seed }}'
          root=pathlib.Path('Output&Results')
          def read(s):
              with (root/(prefix+s)).open(newline='') as f:return list(csv.DictReader(f))
          main=read('_summary.csv')
          audit=read('_screening_summary.csv')
          base=read('_replays.csv')
          extra=read('_screening_samples.csv')
          expected={'DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          assert len(main)==len(audit)==3
          assert {r['algorithm'] for r in main}=={r['algorithm'] for r in audit}==expected
          assert all(int(r['evaluations'])==int(r['captured_evaluations'])==80 for r in main)
          assert len(base)==sum(int(r['replayed']) for r in main)
          assert len(extra)==sum(int(r['sampled']) for r in audit)
          summary={r['algorithm']:r for r in main}
          for r in audit:
              assert int(r['unique_visited'])==int(r['sampled'])+int(summary[r['algorithm']]['replayed'])
              assert int(r['sampled'])==sum(int(r[k]) for k in ('strict_planned_dominated','planned_tie_pool','other_planned_pool'))
              assert 0<int(r['unique_visited'])<=80
              assert float(r['extra_sim_hv'])+1e-6>=float(r['baseline_sim_hv'])
          for r in base+extra:
              assert math.isfinite(float(r['sim_makespan'])) and float(r['sim_makespan'])>0
              assert math.isfinite(float(r['sim_cost'])) and float(r['sim_cost'])>0
          for r in base:
              for obj in ('makespan','cost'):
                  a=float(r['planned_'+obj]);b=float(r['independent_planned_'+obj])
                  assert abs(a-b)<=1e-6*max(1,abs(b))
          print('PASS all unique visited genotypes replayed:',len(base)+len(extra))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exactv12-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/exactv12_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
          retention-days: 90

  report:
    runs-on: ubuntu-latest
    needs: exact
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exactv12-*-${{ github.run_id }}
          path: input
      - name: Recompute family-frozen HV and check winner changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import csv,pathlib,collections,statistics,math
          root=pathlib.Path('input')
          summaries=[p for p in root.rglob('*_summary.csv') if not p.name.endswith('_screening_summary.csv')]
          audits=list(root.rglob('*_screening_summary.csv'))
          bases=list(root.rglob('*_replays.csv'))
          extras=list(root.rglob('*_screening_samples.csv'))
          assert len(summaries)==len(audits)==len(bases)==len(extras)==6
          data=collections.defaultdict(lambda:{'base':[],'all':[]})
          names=['DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]']
          for files,kind in ((bases,'base'),(extras,'extra')):
              for p in files:
                  with p.open(newline='') as f:
                      for r in csv.DictReader(f):
                          key=r['workflow'],int(r['seed']),r['algorithm']
                          assert key[2] in names
                          point=float(r['sim_makespan']),float(r['sim_cost'])
                          assert all(math.isfinite(v) and v>0 for v in point)
                          if kind=='base':data[key]['base'].append(point)
                          data[key]['all'].append(point)
          assert len(data)==18
          for p in audits:
              with p.open(newline='') as f:rr=list(csv.DictReader(f))
              assert len(rr)==3
              for r in rr:
                  key=r['workflow'],int(r['seed']),r['algorithm']
                  assert len(data[key]['all'])==int(r['unique_visited'])
          for p in summaries:
              with p.open(newline='') as f:rr=list(csv.DictReader(f))
              assert len(rr)==3
              for r in rr:
                  key=r['workflow'],int(r['seed']),r['algorithm']
                  assert len(data[key]['base'])==int(r['replayed'])
                  assert int(r['evaluations'])==int(r['captured_evaluations'])==80
          def nd(points):
              pts=sorted(set(points))
              return [p for p in pts if not any(q!=p and q[0]<=p[0] and q[1]<=p[1] for q in pts)]
          def hv(points,ref):
              total,last=0.0,ref[1]
              for m,c in nd(points):
                  if m<ref[0] and c<last:
                      total+=(ref[0]-m)*(last-c)
                      last=c
              return total
          families=sorted({k[0] for k in data})
          refs={}
          for wf in families:
              pts=[p for k,v in data.items() if k[0]==wf for p in v['base']]
              refs[wf]=(max(p[0] for p in pts)*1.05+1,max(p[1] for p in pts)*1.05+1)
          report=['# Full visited-genotype WorkflowSim replay: small-budget v12 comparison','',
            'Three workflow families, two paired seeds, three solvers, 80 real objective evaluations each.',
            'Identical first two cost-seeded schedules, exact simulator replay of every UNIQUE visited genotype.',
            'Frozen HV reference is determined exclusively by planned-front simulator replays across all solvers and seeds within each workflow; extra replays never set the reference.',
            'This is not a global Pareto optimum, a 3030-evaluation benchmark, or an equal-simulator-replay-budget experiment.','',
            '| Workflow | Seed | Original winner | Full-history winner | Winner flip | v12 vs NSGA original | v12 vs NSGA full |',
            '|---|---:|---|---|---|---:|---:|']
          results=[];flips=0;paired=[]
          for wf in families:
              for seed in (1,2):
                  vals={}
                  for alg in names:
                      k=wf,seed,alg
                      b=hv(data[k]['base'],refs[wf]);a=hv(data[k]['all'],refs[wf])
                      assert a+1e-7*max(1,b)>=b
                      vals[alg]=(b,a)
                      results.append(dict(workflow=wf,seed=seed,algorithm=alg,reference_m=refs[wf][0],
                        reference_c=refs[wf][1],base_hv=b,all_hv=a,base_candidates=len(data[k]['base']),
                        visited_candidates=len(data[k]['all']),extra_hv_pct=100*(a/max(1e-12,b)-1)))
                  x=max(names,key=lambda z:vals[z][0]);y=max(names,key=lambda z:vals[z][1])
                  flips+=x!=y
                  d0=100*(vals[names[1]][0]/max(1e-12,vals[names[2]][0])-1)
                  d1=100*(vals[names[1]][1]/max(1e-12,vals[names[2]][1])-1)
                  paired.append((d0,d1))
                  report.append(f'| {wf} | {seed} | {x} | {y} | {x!=y} | {d0:+.3f}% | {d1:+.3f}% |')
          report+=['',f'Winner flips: {flips}/6',
             f'Mean paired v12 vs NSGA-II relative HV: original {statistics.mean(z[0] for z in paired):+.3f}%; all-visited {statistics.mean(z[1] for z in paired):+.3f}%.',
             '', '## Caveats',
             'Small search budget, development families, no general superiority claim.',
             'Extra simulator replays are diagnostic rather than part of optimizer budget.',
             'HV may exclude improvements outside the pre-frozen reference.']
          pathlib.Path('reports/full_visited_v12.md').write_text('\n'.join(report)+'\n')
          with pathlib.Path('reports/full_visited_v12.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(results[0]));w.writeheader();w.writerows(results)
          print('\n'.join(report))
          PY
          cat reports/full_visited_v12.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exactv12-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
