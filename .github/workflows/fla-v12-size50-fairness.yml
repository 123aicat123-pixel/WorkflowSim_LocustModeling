name: v12 cross-size 50-task confirmation with matched costseed NSGA-II

on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-v12-size50-fairness.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-arm:
    name: Fair three-arm ${{ matrix.workflow }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        workflow: [CyberShake_50, Inspiral_50, Montage_50]
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile current research source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes ci-logs 'Output&Results'
          git rev-parse HEAD | tee ci-logs/sha.txt
          find sources examples tests -type f -name '*.java' | sort > ci-logs/sources.txt
          javac -nowarn -encoding UTF-8 -cp 'lib/*' -d build/classes @ci-logs/sources.txt 2>&1 | tee ci-logs/compile.log
      - name: Search 3 arms with same two starting schedules and 3030 evaluations
        shell: bash
        run: |
          set -euo pipefail
          java -Dworkflowsim.planningStageInAware=true \
            -cp 'build/classes:lib/*' org.workflowsim.examples.planning.FLAResearchExperiment \
            '${{ matrix.workflow }}' '${{ matrix.seed }}' 30 100 \
            'Output&Results/v12size50_${{ matrix.workflow }}_s${{ matrix.seed }}' v12-fair-pair \
            2>&1 | tee ci-logs/fair-v12.log
          grep -F 'PASS identical first TWO task->VM deterministic cost seeds' ci-logs/fair-v12.log
      - name: Check exact budgets and all independent replays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,csv,math
          root=pathlib.Path('Output&Results')
          prefix='v12size50_${{ matrix.workflow }}_s${{ matrix.seed }}'
          def read(s):
              with (root/(prefix+s)).open(newline='') as f:return list(csv.DictReader(f))
          rows=read('_summary.csv');replays=read('_replays.csv')
          expected={'DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]'}
          assert len(rows)==3 and {x['algorithm'] for x in rows}==expected
          assert all(int(x['evaluations'])==int(x['captured_evaluations'])==3030 for x in rows)
          assert len(replays)==sum(int(x['replayed']) for x in rows)
          assert {x['algorithm'] for x in replays}==expected
          for r in replays:
              assert math.isfinite(float(r['sim_makespan'])) and float(r['sim_makespan'])>0
              assert math.isfinite(float(r['sim_cost'])) and float(r['sim_cost'])>0
              for obj in ('makespan','cost'):
                  a=float(r['planned_'+obj]);b=float(r['independent_planned_'+obj])
                  assert abs(a-b)<=1e-6*max(1,abs(b)),r
          print('PASS triple matched initialization and 3030 true evaluations per solver')
          PY
      - name: Preserve evidence even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12size50-${{ matrix.workflow }}-s${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ci-logs/
            Output&Results/v12size50_${{ matrix.workflow }}_s${{ matrix.seed }}_*.csv
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    name: v12 three-family 50-task 15-case paired simulator HV report
    needs: three-arm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v12size50-*-${{ github.run_id }}
          path: inputs
          merge-multiple: false
      - name: Recompute frozen HV shared across all solvers and seeds per workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import csv,pathlib,statistics,collections,math
          files=list(pathlib.Path('inputs').rglob('*_replays.csv'))
          sums=list(pathlib.Path('inputs').rglob('*_summary.csv'))
          assert len(files)==len(sums)==15,(len(files),len(sums))
          group=collections.defaultdict(list)
          wfset={'CyberShake_50','Inspiral_50','Montage_50'}
          names=['DAG-Pareto-FLA[v7-costseed]','DAG-Pareto-FLA[v12-hvbandit]','NSGA-II[costseed]']
          for p in files:
              with p.open(newline='') as f: rows=list(csv.DictReader(f))
              assert rows,p
              for r in rows:
                  wf,seed,alg=r['workflow'],int(r['seed']),r['algorithm']
                  assert wf in wfset and seed in (1,2,3,4,5) and alg in names
                  m,c=float(r['sim_makespan']),float(r['sim_cost'])
                  assert math.isfinite(m) and math.isfinite(c) and m>0 and c>0
                  group[(wf,seed,alg)].append((m,c))
          assert len(group)==45,(len(group),group.keys())
          for p in sums:
              with p.open(newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==3 and {x['algorithm'] for x in rows}==set(names)
              assert all(int(x['evaluations'])==int(x['captured_evaluations'])==3030 for x in rows)
          def nd(points):
              u=sorted(set(points))
              return [p for p in u if not any(q!=p and q[0]<=p[0] and q[1]<=p[1] for q in u)]
          def hv(points,ref):
              total=0.0;last=ref[1]
              for m,c in nd(points):
                  if m<ref[0] and c<last:
                      total+=(ref[0]-m)*(last-c)
                      last=c
              return total
          refs={}
          for wf in wfset:
              allpoints=[p for (w,s,a),points in group.items() if w==wf for p in points]
              refs[wf]=(max(p[0] for p in allpoints)*1.05+1,
                        max(p[1] for p in allpoints)*1.05+1)
          vals={key:hv(points,refs[key[0]]) for key,points in group.items()}
          report=['# v12 50-task cross-size confirmation: three equal-initialization solvers',
             '',
             'Three DAG families at 50 tasks, five seeds each, shared reference per family across all three solvers. This merges previously studied development and variant-holdout families; it is not an untouched dataset.',
             'All solvers have identical first two task assignments for costseed, 3030 true objective evaluations, independent WorkflowSim replay. The bandit uses PLANNING Pareto-HV reward, not actual simulator HV during search.',
             'Only planned-nondominated schedules were simulated, not the full evaluated set.',
             '',
             '| Family | v12 vs v7 paired HV mean | v12 wins / 5 | v12 vs cost-seeded NSGA-II mean | v12 wins / 5 |',
             '|---|---:|---:|---:|---:|']
          fullV7=[];fullNSGA=[];csvrows=[]
          for wf in sorted(wfset):
              v7diff=[];nsdiff=[]
              for seed in (1,2,3,4,5):
                  a=vals[(wf,seed,names[1])]
                  b=vals[(wf,seed,names[0])]
                  c=vals[(wf,seed,names[2])]
                  v7diff.append(100*(a/max(1e-12,b)-1))
                  nsdiff.append(100*(a/max(1e-12,c)-1))
                  for alg in names:
                      csvrows.append(dict(workflow=wf,seed=seed,algorithm=alg,
                                          sim_hv=vals[(wf,seed,alg)],
                                          ref_m=refs[wf][0],ref_c=refs[wf][1]))
              fullV7+=v7diff;fullNSGA+=nsdiff
              report.append(f'| {wf} | {statistics.mean(v7diff):+.3f}% | {sum(x>0 for x in v7diff)}/5 | {statistics.mean(nsdiff):+.3f}% | {sum(x>0 for x in nsdiff)}/5 |')
          report.append(f'| **ALL 15** | **{statistics.mean(fullV7):+.3f}%** | **{sum(x>0 for x in fullV7)}/15** | **{statistics.mean(fullNSGA):+.3f}%** | **{sum(x>0 for x in fullNSGA)}/15** |')
          report+=['','Do not treat a 15-case cross-size test as proof of broad statistical superiority.']
          pathlib.Path('reports/v12_size50_report.md').write_text('\n'.join(report)+'\n')
          with pathlib.Path('reports/v12_size50_hv.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(csvrows[0]));w.writeheader();w.writerows(csvrows)
          print('\n'.join(report))
          PY
          cat reports/v12_size50_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12size50-report-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
