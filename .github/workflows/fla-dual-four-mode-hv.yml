name: Read-only FLA Four-Decoder Common Reference True-HV
on:
  push:
    branches: [fla-baseline]
    paths: ['.github/workflows/fla-dual-four-mode-hv.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable old/ready original optimizer and real simulator outputs
        uses: actions/download-artifact@v4
        with:
          run-id: 41670356422
          github-token: ${{ github.token }}
          pattern: fla-ready-search-*-41670356422
          path: original
      - name: Download original mean/worst full optimization and true simulator outputs
        uses: actions/download-artifact@v4
        with:
          run-id: 41672213156
          github-token: ${{ github.token }}
          pattern: fla-dual-*-41672213156
          path: dual
      - name: Independently evaluate same-reference four treatment HV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/fla_dual_model_four_mode_hv_audit.py
          python3 scripts/fla_dual_model_four_mode_hv_audit.py original dual reports | tee reports/stdout.log
          git rev-parse HEAD > reports/source-sha.txt
          echo 'Source Actions: old/ready=41670356422 mean/worst=41672213156' > reports/provenance.txt
          cat reports/paired_true_hv_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive all four-mode full actual K16 Pareto points and negative findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fla-dual-four-mode-hv-${{ github.run_id }}
          path: reports
          retention-days: 90
          if-no-files-found: warn
